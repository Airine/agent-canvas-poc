<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PI Desktop native component probe</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:#edf0f3;color:#20242a;font:14px system-ui}
h1{font-size:23px;margin:0 0 8px}p{color:#59616e;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(450px,1fr));gap:20px;max-width:1500px}
section{border:1px solid #cbd0d7;border-radius:14px;overflow:hidden;background:white;min-width:0}
header{padding:12px 16px;border-bottom:1px solid #e4e7eb;font-weight:600}
header span{float:right;font-size:11px;color:#666;font-weight:400}
iframe{display:block;width:100%;height:720px;border:0}
@media(max-width:980px){.cards{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<h1>PI Desktop original components / isolated cards</h1>
<p>v0.20.1 source + original styles. FIXTURE ONLY: no model, runtime, files or credentials connected.</p>
<div class="cards">
<section><header>Agent card A <span>OWN STORE / TEST DATA</span></header><iframe title="PI Desktop card A" src="/ui.html?card=A"></iframe></section>
<section><header>Agent card B <span>OWN STORE / TEST DATA</span></header><iframe title="PI Desktop card B" src="/ui.html?card=B"></iframe></section>
</div></body></html>

<style>
  :root {
    --bg: #F2EFE6;

    --warn: #BE5560;

    --asidew: clamp(300px, 26vw, 420px);

    --sans: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --serif: "Georgia", "Songti SC", serif;
    /* 浮空层材质：1px 半透 ring + 两层贴身柔光，代替「边框 + 一团模糊阴影」 */
    --shadow-float: 0 0 0 1px oklch(0 0 0 / .07), 0 1px 2px -1px oklch(0 0 0 / .07), 0 3px 8px -2px oklch(0 0 0 / .07);
  }

  /* 按下反馈：独立 scale/translate 属性不碰既有 transform/transition，可中断回弹；按压 80ms 释放 160ms */
  #panel .chip, #panel .morebtn, .hmodal .hclose { transition: scale .16s cubic-bezier(.2, 0, 0, 1); }
  /* 分段控件滑动指示器：选中态是一枚在按钮间滑动的药丸，位置/宽度由 JS 实测驱动 */
  .seg-ind {
    position: absolute; top: 3px; bottom: 3px; left: 0; z-index: 0; border-radius: 8px; pointer-events: none;
    transition: translate .26s cubic-bezier(.22, 1, .36, 1), width .26s cubic-bezier(.22, 1, .36, 1);
  }
  .tabs .seg-ind { background: var(--card); border: 1px solid var(--line); }
  #flowbar .seg-ind { border-radius: 9px; background: var(--accent); }
  header button:active, .tabs button:active, #flowbar button:active, #panel .chip:active, #panel .morebtn:active, .vstat:active { scale: .96; transition-duration: .08s; }
  .hmodal .hclose:active, nav .grp .chev:active { scale: .92; transition-duration: .08s; }
  nav .item:active, nav .grp:active, #panel .steps li:active, #panel li.fi.mod:active { translate: 0 1px; }
  html, body { height: 100%; }

  .isw { position: relative; display: inline-flex; flex-shrink: 0; vertical-align: -2px; }

  header { display: flex; align-items: center; gap: 15px; padding: 12px 16px 5px; }

  header .spacer { flex: 1; }

  }

  header button.primary:hover { background: var(--accent-deep); }

  header button.vitals-btn .ic { color: var(--hc); }

  dialog#healthDlg {

  dialog#healthDlg[open] { display: flex; align-items: center; justify-content: center; }

    padding: 18px 24px 26px; box-shadow: var(--shadow-float), 0 20px 60px rgba(20, 20, 19, .24);
  }
  /* forced-colors 会把 box-shadow 归零，只靠阴影画的边界要补真边框 */
  @media (forced-colors: active) { #flowbar, .hmodal { border: 1px solid CanvasText; } }
  .hmodal .hclose {
    position: sticky; top: 0; float: right; margin: -4px -8px 0 0;
    width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
  }
  .hmodal .hclose:hover { background: var(--surface); color: var(--ink); }

  }
  .hmodal .hhead .ic { color: var(--hc, var(--ink)); }
  dialog#healthDlg[open] .hmodal { animation: hin .2s cubic-bezier(.16, 1, .3, 1); }
  @keyframes hin { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; position: relative; }
  /* 把手：贴边半圆，展开时贴面板外缘、收起时贴视口边缘，位置本身带过渡 */
  .handle {
    position: fixed; z-index: 30; top: 50%; transform: translateY(-50%);
    width: 24px; height: 48px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
    color: var(--ink-soft);
    transition: left .26s cubic-bezier(.2, 0, 0, 1), right .26s cubic-bezier(.2, 0, 0, 1),
                width .15s, background .15s, color .15s;
  }
  .handle:hover { width: 28px; background: var(--surface); color: var(--accent-deep); }
  .handle .ic { width: 13px; height: 13px; transition: transform .22s; }
  /* 展开时向面板方向压 1px 盖住面板边框且不带阴影，半圆与面板融为一体；收起悬浮在屏幕边缘时才需要投影 */
  #handleNav { left: calc(12px + var(--navw) - 1px); border-left: none; border-radius: 0 24px 24px 0; }
  body.nav-off #handleNav { left: 0; box-shadow: 2px 0 10px rgba(20, 20, 19, .07); }
  body.nav-off #handleNav .ic { transform: rotate(180deg); }
  #handleAside { right: calc(12px + var(--asidew) - 1px); border-right: none; border-radius: 24px 0 0 24px; }
  #handleAside .ic { transform: rotate(180deg); }
  body.aside-off #handleAside { right: 0; box-shadow: -2px 0 10px rgba(20, 20, 19, .07); }
  body.aside-off #handleAside .ic { transform: rotate(0deg); }
  /* 跨断点是布局模式切换（挤占 ↔ 覆盖），定位机制不同无法平滑，瞬间切换比半吊子动画干净 */
  body.no-anim nav, body.no-anim aside, body.no-anim .handle { transition: none; }
  /* 拖宽把手：6px 命中区不变，可视指示是居中的小圆条 */
  #asideResize {
    position: absolute; z-index: 25; top: 10px; bottom: 12px; width: 6px;
    right: calc(12px + var(--asidew) - 3px); cursor: col-resize;
    transition: right .24s cubic-bezier(.2, 0, 0, 1);
  }
  #asideResize::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 3px; height: 44px; border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 60%, transparent);
    opacity: 0; transition: opacity .15s;
  }
  #asideResize:hover::after, #asideResize.on::after { opacity: 1; }
  body.aside-off #asideResize { display: none; }
  body.resizing nav, body.resizing aside, body.resizing .handle, body.resizing #asideResize { transition: none; }
  nav, #stage, aside {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }

  /* 图例：虚实两种边是不同语义，不解释等于没编码。无壳居中，纯注记不抢画布 */
  #legend {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 4;

  #panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }

  .gauge circle { fill: none; stroke-width: 8; }
  .gauge .gbg { stroke: color-mix(in srgb, currentColor 16%, transparent); }
  .gauge .gfg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.16, 1, .3, 1); }
  .gscore { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 22px var(--mono); color: var(--ink); }
  .gscore span { font-size: 10px; color: var(--ink-soft); margin: 9px 0 0 1px; }
  .vmeta { flex: 1; min-width: 0; }
  .vgrade { font: 700 15px var(--sans); }
  .vadvice { margin: 2px 0 9px; }
  .vadvice div { font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
  .vadvice b { font-weight: 700; }
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vstat { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 3px; text-align: center; cursor: pointer; transition: border-color .15s, scale .16s cubic-bezier(.2, 0, 0, 1); }
  .vstat:hover { border-color: var(--accent); }
  .vstat .vv { font: 700 14px var(--mono); color: var(--ink-soft); }
  .vstat .vv em { font: 600 9.5px var(--sans); font-style: normal; opacity: .85; }
  .vstat .vk { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .hmodal .md-body { font: 12.5px/1.75 var(--sans); }
  .hmodal .md-body h2 { font: 700 13px/1.5 var(--sans); margin: 20px 0 8px; }
  .hmodal .md-body h3 { font: 700 12px var(--sans); margin: 14px 0 6px; }
  .hmodal .md-body p, .hmodal .md-body li { font-size: 12.5px; }
  .hmodal .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  .hmodal .md-body li { margin: 3px 0; }
  .hmodal .md-body li::marker { color: var(--accent); }
  .hmodal .md-body code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .hmodal .md-body table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
  .hmodal .md-body th, .hmodal .md-body td { border: 1px solid var(--line); padding: 5px 9px; font-size: 11.5px; text-align: left; }
  .hmodal .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  .hmodal .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .dt { transition: opacity .18s; }
  .dt.dim { opacity: .13; }
  @media (prefers-reduced-motion: reduce) {
    .gauge .gfg { transition: none; }
    dialog#healthDlg[open] .hmodal { animation: none; }
  }
  #panel .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--ink-soft); margin: 0 0 11px; }
  #panel .md-body a { color: var(--accent-deep); }
  #panel .md-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; }
  .b, .lk { transition: opacity .18s, transform .2s ease; cursor: pointer; }
  .dfloor { cursor: pointer; }
  .dfloor polygon { transition: fill .18s, stroke-width .18s; }
  .dfloor.sel polygon { stroke-dasharray: none; stroke-width: 2.4; }
  nav .grp.sel { outline: 1.5px solid currentColor; outline-offset: -1.5px; }
  .hbadge { cursor: pointer; }
  .hbadge .ring { transition: r .15s ease-out; }
  .hbadge:hover .ring { r: 8.5; }
  .b.dim, .lk.dim { opacity: .13; }
  /* 聚焦时结构边要真的亮起来：细虚线本身就淡，只靠不压暗看不出区别 */
  #svg g.lk.hi > path:first-child { opacity: 1; stroke-width: 1.7; stroke: var(--ink); }
  #svg g.b:not([data-plate]):hover { transform: translateY(-3px); }
  #svg g.b.hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-7px); } 60% { transform: translateY(-1px); } }
  #selring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #selring, #svg g.b.hop { animation: none; }
    #svg g.b:not([data-plate]):hover { transform: none; }
    nav, aside, .handle, .isw .ic, .seg-ind { transition: none; }
  }
  /* 窄屏：两栏转为固定抽屉，把手停靠屏幕边缘 */
  @media (max-width: 1080px) {
    nav {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(78vw, 320px); border-radius: 0 16px 16px 0;
      box-shadow: 10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.nav-off nav { margin: 0; opacity: 1; transform: translateX(calc(-100% - 40px)); }
    #handleNav { left: calc(min(78vw, 320px) - 1px); }
    body.nav-off #handleNav { left: 0; }
  }
  @media (max-width: 820px) {
    #asideResize { display: none; }
    aside {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(88vw, 360px); border-radius: 16px 0 0 16px;
      box-shadow: -10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.aside-off aside { margin: 0; opacity: 1; transform: translateX(calc(100% + 40px)); }
    #handleAside { right: calc(min(88vw, 360px) - 1px); }
    body.aside-off #handleAside { right: 0; }
  }
  @media (max-width: 700px) {
    .statbar { display: none; }
    header { gap: 6px; }
    header button.compact .lb { display: none; }
    header button.compact { padding: 7px 9px; }
    .vstats { grid-template-columns: repeat(2, 1fr); }
    .hmodal { padding: 16px 16px 22px; }
  }
</style>
</head>

: canvas\n        to: control-plane\n        title: 传递版本与幂等意图\n        sources: [app/src/pages/canvas/live-store.ts]\n      - from: control-plane\n        to: e-runtime\n        title: 修改后回读配置\n        sources: [app/api/routes.ts]\n  - title: 发送消息\n    page: data-flow.md#发送消息\n    steps:\n      - from: chat-ui\n        to: canvas\n        title: 提交会话命令\n        sources: [app/src/pages/canvas/chat/Composer.tsx]\n      - from: canvas\n        to: control-plane\n        title: 工作区 HTTP 请求\n        sources: [app/src/pages/canvas/live-store.ts]\n      - from: control-plane\n        to: e-runtime\n        title: 校验后交给会话管理器\n        sources: [app/api/routes.ts]\n      - from: e-runtime\n        to: message-content\n        title: 校验消息和附件\n        sources: [app/api/e/session-manager.ts]\n      - from: e-runtime\n        to: external-runtime\n        title: 通过桥接发送消息\n        sources: [app/scripts/e-runtime-worker.mts]\n  - title: 审批工具\n    page: data-flow.md#审批工具\n    steps:\n      - from: e-runtime\n        to: e-approvals\n        title: 观察待审批操作\n        sources: [app/api/e/session-manager.ts]\n      - from: e-approvals\n        to: e-runtime\n        title: 复核后提交决定\n        sources: [app/api/e/approval-engine.ts]\n  - title: 兼容终端\n    page: data-flow.md#兼容终端\n    steps:\n      - from: canvas\n        to: control-plane\n        title: 订阅终端\n        sources: [app/src/pages/canvas/live-store.ts]\n      - from: control-plane\n        to: herdr\n        title: 读取并回传终端快照\n        sources: [app/api/routes.ts]\n  - title: Agent 协作\n    page: data-flow.md#agent-协作\n    steps:\n      - from: external-runtime\n        to: e-runtime\n        title: 已审批工具通过私有描述符请求\n        sources: [app/scripts/canvas-tools.mjs, app/scripts/e-runtime-worker.mts]\n      - from: e-runtime\n        to: collaboration\n        title: 绑定当前调用与保存通信记录\n        sources: [app/api/e/session-manager.ts, app/api/e/collaboration-authorization.ts]\n      - from: collaboration\n        to: e-runtime\n        title: 目标待发队列确认消费\n        sources: [app/api/e/collaboration.ts, app/api/e/session-manager.ts]\n      - from: collaboration\n        to: control-plane\n        title: 实际记录投影通信边\n        sources: [app/api/routes.ts]\n  - title: 启动与退出\n    page: data-flow.md#启动与退出\n    steps:\n      - from: development\n        to: control-plane\n        title: 启动本地服务\n        sources: [app/scripts/dev-e.mjs]\n---\n\n# 数据流\n\n## 浏览器入口\n\n`app/src/main.tsx` 装配路由和主题。`/` 读取工作区列表；新建表单先取 `/api/runtime/status`，再提交 `POST /api/workspaces {backend:'e',title}` 与 `POST /api/workspaces/:wid/sessions {title,provider?,model?}`。成功后进入 `/canvas/:wid`。\n\n`/welcome` 介绍旧原型，`/react-flow` 和 `/tldraw` 使用本地事件引擎；这两条路径的数据来自模拟场景，不写真实会话。`/canvas` 负责选择工作区后跳转。文档站 `/`、`/docs/*`、`/api/search` 属于独立的 Next 进程，其数据流见[文档站模块](modules/documentation.md)。\n\n## 控制面入口\n\n`app/api/index.ts` 接受 HTTP 后先校验本机 Host 与 Origin，再挂载 `routes.ts` 的 `/api`。创建工作区经 Zod 校验后写入注册表，保存为数据目录下的 `workspaces.json`，写入使用临时文件后重命名。读取接口返回图、工作区或会话视图；旧 `/api/graph` 使用活动工作区，新功能应明确带工作区 ID。\n\n布局拖动提交 `PATCH /api/workspaces/:wid/layout {positions:[{id,x,y}]}`，校验全部节点后更新图并保存。自动布局调用同一工作区的 `POST .../layout`，经 `computeLayout` 计算坐标再广播。归档先保存只读状态，再停止该工作区的会话。图的持久化与会话记录是不同文件，不能拿前者恢复完整对话。\n\n## 会话进程\n\n会话创建或恢复经 `SessionManager` 启动 worker，IPC `init` 携带运行配置。worker 从 `ADE_ROOT` 动态加载 e 核心与桥接模块，建立 socket、启动 daemon 和 Pi RPC，验证原生会话标识与可用能力。订阅到的核心快照通过 IPC `ready` / `snapshot` 回到父进程。\n\n父进程更新会话记录并发出 `changed`；`routes.ts` 将它投影为画布节点并广播。创建、恢复、停止等生命周期状态持久化到会话记录，原生 Pi 会话文件仍属于 Pi；停机不等于删除历史。\n\n## 发送消息\n\n聊天输入台调用 `LiveStore.sessionAction`，提交工作区内节点的 `/messages`。载荷为 `{intentId,content,attachments,deliverAs}`；附件项包含 `{id,name,mimeType,data}`，其中图片数据是受大小限制的编码内容，不是任意本机文件路径。\n\n控制面确认后端与工作区可写后调用 `SessionManager.control`。管理器校验内容、记录幂等意图，再发 IPC `control`。worker 串行执行控制：读取当前 Pi 状态、预检图片输入、构造内容块，调用 `controlSession` 获取最新能力后发送。\n\n核心 action 与快照回到父进程，写入记录，再经 WebSocket 推送给当前工作区。HTTP 返回“已接受”不代表模型已经回复；结果以核心 action 和会话状态为准。\n\n待发编辑使用 `/queue {mutationId,expectedRevision,operation,itemId,...}`。新增与编辑在提交前验证最终队列的总字节容量，超限不改变队列。管理器保存后在会话就绪时尝试发送。只有核心确认相同幂等键的 action 已应用，队列项才变成已消费；结果未知时暂停，不自动重发。回归入口见[审查记录](review.md)。\n\n## Agent 协作\n\n启动前 API 生成期望 manifest，worker 独立比对并显式加载 Skill 与扩展。私有 hello/welcome 核验实际 Skill 发现、四工具注册、系统指令绑定与版本/摘要；只有完整证据使 collaboration ready。资源漂移、断线或不兼容撤销协作，不自动重试，不阻断普通聊天。只读包检查器不是控制入口。\n\n`canvas-tools.mjs` 在 Pi 注册四个工具。`canvas-adapter.mjs` 生成只扩展审批名单的本地适配器；批准后，工具发送 `{toolCallId,tool,args}` 到不可被子工具继承的私有 FD，worker 转成父 IPC `collaboration`。父进程从自己的 worker 绑定选择来源，`authorizeCollaboration` 对照 e 快照核验正在运行的完整工具与已批准记录。\n\n`CollaborationStore.execute` 解析同画布 hash 引用；读取返回文本来源和 SHA-256，发布保存不可变产物，发送将带受管 origin 的消息加入目标队列。操作意图先落盘，回执和内容签名防重；未知不重放。`SessionManager.changed` 根据实际 queue/action 更新记录状态，`applyCommunications` 使用 `GraphStore.upsertEdge` 发工作区边补丁。API 重启按账本重新投影，而不是依赖旧图充当事实源。\n\n浏览器复制和补全仅插入 `@\"名字\"#hash`，没有直接投递路径；Agent 可选择不调用任何工具。最新回复按消息时间，不按重放数组顺序。来源恢复只用先前真实关联的同 native、时间和完整内容摘要唯一匹配。详见 [Canvas 协作](modules/collaboration.md)。\n\n## 配置与身份\n\n昵称更新提交 `PATCH .../session {title,expectedVersion}`，只改变应用显示名称。模型与思考级别走 `/configuration`：父进程验证 revision，worker 在空闲检查和串行锁内修改，再从 Pi 回读实际配置，确认原生身份未变后更新状态。原生身份、显示昵称和短标识不能互相替代。\n\n## 审批工具\n\n手工批准/拒绝通过工作区内节点的 `/approval`，携带幂等意图与审批 ID。自动模式由会话变化触发 `ApprovalEngine.observe`，先绑定具体参数和摘要，再跑硬规则或独立审查。提交前重查会话代次、参数摘要与当前规则，最终仍由 worker 的 `bridge.resolveApproval` 执行。\n\n精确授权要求完整参数、摘要匹配和风险确认。停止会话、人工介入或切换模式会取消旧审查，不能让过期决定跨会话代次生效。辅助审批路径拒绝任一层符号链接及父目录跳转，修复与预检边界见[代码审查](review.md)。\n\n## WebSocket 推送\n\n升级 `/ws` 后，浏览器发送 `hello {workspaceId}`。服务先清理这个连接的旧订阅，再返回 `graph` 与 e 会话视图。消息包含 `workspaceId`、`generation` 和单连接递增 `sequence`，客户端按范围和代次消费。\n\n图变化、会话变化和兼容事件分别通过 `onAnyPatch`、`eSessions.changed`、事件总线进入 `wireBroadcasts`。广播只发给选中工作区的连接；兼容事件本身包含工作区 ID，历史查询与消息速率也按工作区隔离。\n\n## 兼容终端\n\nherdr 的 `/run` 经 `requireHerdr` 检查后进入 coordinator。它创建 workspace/tab/pane，将命令发到 herdr socket。shell wrapper 写退出标记，脚本可写阻塞、进度与 outbox 标记；400 ms 轮询据此推进图状态，最终持久化图。\n\n浏览器 `term.subscribe` 交给 pump，500 ms 读取 pane，回传 `term {nodeId,ansi,workspaceId}`。断开连接清理该连接的订阅。前端重连或序号缺口重新 hello，在完整图到达后恢复仍活跃的 herdr 订阅；e 不走终端恢复。旧版审批通过 pane 输入 `go` 或 `abort`，与 e 工具审批协议不同。\n\n## 启动与退出\n\n`dev-e.mjs` 读取本机环境文件、检测端口，再启动 API 与 Vite；生产模式只启动已构建 API，托管静态 UI。启动器请求 `/api/runtime/status` 确认接线，退出时转发信号并在超时后清理子进程。\n\nAPI 收到 SIGINT / SIGTERM 时关闭 HTTP / WebSocket，再关闭会话管理器。worker 收到停止请求后断开桥接与 socket，终止 Pi 与 daemon。此处是进程内清理，不存在另一个后台定时服务。\n\n## 历史工具\n\n`app/scripts/agents/*.sh` 由示例图的 herdr 节点命令触发，读写协调器约定的标记目录。`tools/legacy/spike/*.py` 显式连接 Unix socket，以换行 JSON 发送 RPC 并采集事件。`tools/legacy/render-preview/` 的 Python/JS 脚本连接已运行的 HTTP / WS 服务，轮询图或终端并输出验收信息；部分会启动、重置或自动批准任务，不能当只读探测随意执行。\n\n测试文件由 Node test / Playwright 调用，配置文件由构建工具加载；它们不是独立产品服务。逐项分类见[入口对账](entrypoints.md)。\n","entrypoints.md":"---\ntitle: 入口对账\ndescription: 逐项裁决静态图的零入度候选，区分运行入口、工具配置和未接入代码。\ngenerated: npm --prefix docs-site run architecture:analyze\ngenerated-at: bc3fe792b0fa1cc587067690e7494ab127bf01b2\n---\n# 入口对账\n\n依赖图按工作区当前内容生成；零入度只说明没有仓内静态导入者，不能单凭这一点删除文件。下表逐项分类。\n\n| 文件 | 裁决 |\n| --- | --- |\n| `app/api/index.ts` | 真实入口：HTTP / WebSocket 控制面，见数据流「控制面入口」 |\n| `app/eslint.config.js` | 非入口：构建或检查配置，由对应工具加载 |\n| `app/playwright.config.ts` | 非入口：构建或检查配置，由对应工具加载 |\n| `app/postcss.config.js` | 非入口：构建或检查配置，由对应工具加载 |\n| `app/scripts/canvas-tools.mjs` | 真实入口：由会话 worker 生成的扩展显式加载，走私有 FD 与 e 审批，见数据流「Agent 协作」 |\n| `app/scripts/collaboration-inspect.mjs` | 只读入口：打印版本匹配的 Skill / 契约 / manifest，不启动会话或发送消息 |\n| `app/scripts/demo-quant-canvas/run.mjs` | 示例入口：离线量化研究模拟，显式运行，不连接模型或券商 |\n| `app/scripts/dev-e.mjs` | 真实入口：开发/生产启动器，见数据流「启动与退出」 |\n| `app/scripts/e-runtime-worker.mts` | 真实入口：父进程 fork 的 IPC worker，见数据流「会话进程」 |\n| `app/shared/agent-reference.d.mts` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `app/shared/collaboration-package.d.mts` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `app/shared/collaboration-protocol.d.mts` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `app/shared/message-content.d.mts` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `app/src/components/ui/alert-dialog.tsx` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `app/src/components/ui/badge.tsx` | 非入口：未接入文件或可复用组件，结合死代码复核，不推断运行能力 |\n| `a ixtures/session-worker.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/global-card-view.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/health-regressions.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/live-store-reconnect.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/message-origins.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/production-assets.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/quant-canvas-demo.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/recovery-presentation.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/runtime-config-presentation.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/session-identity.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/session-store.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/theme-tokens.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/test/unit/workspace-paths.test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n| `app/vite.config.ts` | 非入口：构建或检查配置，由对应工具加载 |\n| `tools/legacy/render-preview/ws-term-test.mjs` | 测试入口：由测试运行器或显式命令执行，不是产品服务 |\n\nPython 与 shell 不属于 JS/TS 解析范围：`tools/legacy/spike/*.py` 和 `tools/legacy/render-preview/*.py` 是手工验证入口；`app/scripts/agents/*.sh` 由 herdr 节点配置触发。其流程见[数据流](data-flow.md)。不存在本仓新增的 HTTP 定时任务或外部队列消费者；待发消费和轮询属于已有进程内部。\n\n文档站另有框架入口：`docs-site/app/page.tsx` 首页、`app/docs/[[...slug]]/page.tsx` 文档、`app/api/search/route.ts` 搜索；这里的 `app/` 均相对文档站。生成与校验脚本均为显式 npm 命令，见[文档站模块](modules/documentation.md)。\n","getting-started.md":"---\ntitle: 本地启动\ndescription: 分别启动文档站和真实会话应用，不覆盖已有本机配置。\nsources:\n  - docs-site/package.json 74b39960b4a2\n  - app/scripts/dev-e.mjs 82c22e9d56a3\n  - app/package.json 76486a23e156\n  - app/scripts/e-runtime-worker.mts 597fd806824d\n---\n\n# 本地启动\n\n## 只阅读文档\n\n在仓库根目录执行：\n\n```bash\nnpm --prefix docs-site ci\nnpm --prefix docs-site run dev\n```\n\n打开 `http://127.0.0.1:4310`。首页是 Landing Page，正文在 `/docs`，架构地图在 `/architecture.html`。文档站与产品进程独立，不需要启动 ADE、Pi 或 herdr。\n\n开发启动会先校验架构 wiki，再生成 Fumadocs 内容。修改 wiki 后重新执行启动命令；不要编辑被忽略的 `docs-site/content/docs/`，下次生成会覆盖它。\n\n## 运行真实会话应用\n\n使用 Node 22.13 或更高版本；本机需要已安装的 ADE checkout、Pi CLI 及可用模型配置。ADE 路径是本机前置条件，本仓库不会替你安装或下载模型凭据。\n\n```bash\ncd app\nnpm ci\ntest -e .env.e || cp .env.e.example .env.e\n# 编辑 .env.e 中的 ADE_ROOT；已有文件不要覆盖\nnpm run dev:e\n```\n\n按启动器输出的 URL 打开应用。默认 UI 端口为 5173，API 为 3300；本机配置可能不同。启动器检测端口占用后会退出，不会悄悄换端口或接管其他进程。`CANVAS_PROJECT_ROOT` 可指定会话项目；默认由仓库位置推导，不依赖运行命令时所在目录。\n\n进入首页后创建 e 工作区，再创建 Pi 会话。运行时未就绪时先看状态原因，不要把原型页面里的模拟反馈当作真实模型响应。\n\n## 构建与检查\n\n```bash\n# 文档\nnpm --prefix docs-site test\nnpm --prefix docs-site run typecheck\nnpm --prefix docs-site run build\nnpm --prefix docs-site start\n\n# 产品代码，不启动真实会话\nnpm --prefix app test\nnpm --prefix app run lint\nnpm --prefix app run build\nnpm --prefix app run build:api\n```\n\n产品生产启动为 `cd app && npm run start:e`，先完成 UI 与 API 构建。它仍使用本机配置，只运行单个 API 服务并托管构建后的 UI。不要把 API 直接暴露到公网。\n\n浏览器 E2E 可能依赖既有服务与真实 Pi，运行前读 `app/playwright.config.ts` 和 `docs/guides/E_INTEGRATION_VERIFICATION.md`。历史 `tools/legacy/render-preview/` 脚本存在自动运行、重置与批准行为，不属于只读检查。\n\n## 加载协作工具\n\n复制与 `@` 是浏览器功能；实际读取/发消息需要当前 API 与新启动的受管 Pi 扩展。后端不是热重载模式：确认任务可以停止后再重启服务，并明确恢复所需会话。恢复不会自动恢复暂停队列。不要为更新工具中断别人正在执行的任务。工具范围和审批见 [Canvas 协作](modules/collaboration.md)。\n\n## 常见阻塞\n\n- 文档启动提示哈希漂移：先按[维护流程](maintenance.md)读差异，不能直接刷新哈希掩盖变化。\n- 真实应用提示 ADE 不可用：检查 `.env.e` 的绝对路径与 ADE 模块接口是否匹配。\n- 模型列表为空或 Pi 不可用：先确认本机合法模型配置与 CLI 路径；不把凭据写进文档或提交。\n- 想体验旧终端：阅读[herdr 兼容模块](modules/herdr.md)，它与 e 会话控制不是同一条运行路径。\n","health.md":"---\ntitle: 代码体检\ndescription: 未使用文件、循环依赖、历史热点和静态解析断点。\ngenerated: npm --prefix docs-site run architecture:analyze\ngenerated-at: bc3fe792b0fa1cc587067690e7494ab127bf01b2\n---\n# 代码体检\n\n本页由 `npm --prefix docs-site run architecture:analyze` 再生。范围为当前工作区（包含未跟踪、未忽略文件），共 241 个 JS/TS 源文件。历史 churn 仅来自已提交记录，不代表未提交代码的风险大小。原始结果位于 `docs/architecture/reports/`。\n\n## 死代码\n\n2026-10-19 的 59 项人工复核：34 个文件已删除；12 个保留未提交内容、7 个保留其依赖，均仍计入未使用候选。6 项内容或存在状态改变，需要重新复核；0 项不再由 Knip 报未使用。逐项证据与职责见[未使用文件复核](unused-files.md)。\n\nKnip 报告 25 个未使用文件、36 个未使用导出。经过文件名和基础名的全仓字符串搜索，0 个没有引用痕迹，25 个保留为疑似；分析脚本本身不删除文件，人工清理见复核记录。\n\n本次未发现符合此分类的文件。\n\n### 疑似（存在动态引用痕迹，需人工确认）\n\n字符串痕迹可能来自文档、CSS 或通用名称，并不证明运行时使用；人工保留原因见上方逐项复核。\n\n- `app/src/hooks/use-mobile.ts`：引用痕迹见 `app/src/components/ui/README.md`、`app/src/components/ui/sidebar.tsx`；静态未使用不等于可删除。\n- `app/src/components/ui/alert-dialog.tsx`：引用痕迹见 `app/info.md`、`app/package.json`、`app/src/components/ui/README.md`、`app/src/index.css`、`app/src/pages/canvas/chat/ChatPopover.tsx`；静态未使用不等于可删除。\n- `app/src/components/ui/badge-variants.ts`：引用痕迹见 `app/src/components/ui/README.md`、`app/src/components/ui/badge.tsx`；静态未使用不等于可删除。\n- `app/src/components/ui/badge.tsx`：引用痕迹见 `app/info.md`、`app/src/components/ui/README.md`、`app/src/components/ui/badge-variants.ts`、`app/src/components/ui/sidebar.tsx`、`app/src/index.css`；静态未使用不等于可删除。\n- `app/src/components/ui/button-group-variants.ts`：引用痕迹见 `app/src/components/ui/README.md`、`app/src/components/ui/button-group.tsx`；静态未使用不等于可删除。\n- `app/src/components/ui/button-group.tsx`：引用痕迹见 `app/info.md`、`app/src/components/ui/README.md`、`app/src/components/ui/button-group-variants.ts`；静态未使用不等于可删除。\n- `app/src/components/ui/calendar.tsx`：引用痕迹见 `app/info.md`、`app/src/components/ui/README.md`；静态未使用不等于可删除。\n- `app/src/components/ui/form-context.ts`：引用痕迹见 `app/src/components/ui/README.md`、`app/src/components/ui/form.tsx`；静态未使用不等于可删除。\n- `app/src/components/ui/form.tsx`：引用痕迹见 `app/README.md`、`app/api/e/attachments.ts`、`app/api/e/session-manager.ts`、`app/api/eventbus.ts`、`app/api/graphs/etl-nightly.json`；静态未使用不等于可删除。\n- `app/src/components/ui/input.tsx`：引用痕迹见 `app/api/coordinator.ts`、`app/api/e/approval-engine.ts`、`app/api/e/approval-reviewer.ts`、`app/api/e/approval-rules.ts`、`app/api/e/collaboration.ts`；静态未使用不等于可删除。\n- `app/src/components/ui/label.tsx`：引用痕迹见 `app/api/coordinator.ts`、`app/api/e/collaboration.ts`、`app/api/e/contracts.ts`、`app/api/graph.ts`、`app/api/graphs/demo-release-pipeline.json`；静态未使用不等于可删除。\n- `app/src/components/ui/

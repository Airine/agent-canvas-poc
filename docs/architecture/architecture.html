es/canvas/EApprovalCard.tsx`：引用痕迹见 `docs/chat-experience.md`；静态未使用不等于可删除。\n- `app/src/pages/canvas/collaboration-demo/model.ts`：引用痕迹见 `app/api/coordinator.ts`、`app/api/e/approval-reviewer.ts`、`app/api/e/config.ts`、`app/api/e/contracts.ts`、`app/api/e/session-manager.ts`；静态未使用不等于可删除。\n\n## 循环依赖\n\n规定命令 `npx -y knip@5 --reporter json --include files,exports,cycles` 返回 `Invalid issue type: cycles`。死文件/导出改用支持的 `files,exports`；循环使用 oxc 导入图上的 Tarjan 强连通分量复核，不把命令失败当作零循环。\n\n本次静态图没有多节点循环分量或自环。模板字符串动态导入不在此结论范围内。\n\n## 高危热点\n\n按 `git log --since=\"12 months ago\" --name-only --pretty=format:` 的改动次数乘当前行数排序；这是审查优先级信号，不是已确认缺陷。\n\n| 文件 | 12 个月改动次数 | 行数 | 乘积 |\n| --- | ---: | ---: | ---: |\n| `app/src/components/ui/sidebar.tsx` | 1 | 705 | 705 |\n| `app/src/pages/canvas/mock-server.ts` | 1 | 640 | 640 |\n| `app/api/coordinator.ts` | 1 | 617 | 617 |\n| `app/src/pages/canvas/index.tsx` | 1 | 610 | 610 |\n| `app/api/routes.ts` | 1 | 507 | 507 |\n| `app/src/pages/reactflow/index.tsx` | 1 | 475 | 475 |\n| `app/src/pages/canvas/live-store.ts` | 1 | 469 | 469 |\n| `app/api/herdr-adapter.ts` | 1 | 421 | 421 |\n| `app/src/pages/tldraw/EdgesLayer.tsx` | 1 | 385 | 385 |\n| `app/src/pages/canvas/LiveTerminal.tsx` | 1 | 325 | 325 |\n\n## 断点\n\noxc 未报告解析失败或无法解析的相对导入。别名按 tsconfig 自动解析；依赖包与仓库外 ADE 路径不当作仓内断链。\n\n模板字符串动态导入对静态解析不可见（不进 imports 也不进 unresolved），靠死文件复核与边界回报兜底。\n\n零入度文件的逐项裁决见[入口对账](entrypoints.md)，人工 Review 见[代码审查](review.md)。\n","index.md":"---\ntitle: 文档导航\ndescription: 从本地启动到代码边界，找到 Agent Canvas 的实现依据。\nbaseline: bc3fe792b0fa1cc587067690e7494ab127bf01b2\nsources:\n  - app/src/App.tsx 10682b846ed7 App\n  - app/api/index.ts fb665635c747 wireBroadcasts\nexclude:\n  - docs/chat-experience/\n  - docs/desktop-chat-evidence/\n  - docs/chat-ui-polish-evidence/\n  - docs/desktop-chat-experience.md\n  - docs/chat-ui-polish.md\n  - docs/card-views-and-approvals.md\n  - docs/chat-experience.md\n  - docs/themes.md\n  - docs/canvas-collaboration.md\n---\n\n# 文档导航\n\nAgent Canvas 是本地多 Agent 会话工作台。当前主线使用 e / Pi 运行真实会话；React Flow 承载画布，Hono 提供本地控制面。旧 herdr 路径与两个画布原型仍保留，但它们的能力不能直接算到 e MVP 上。\n\n## 先找到要做的事\n\n- 第一次运行：[本地启动](getting-started.md)。\n- 想了解整体设计：[系统总览](system.md)与[架构地图](../architecture.html)。\n- 想追踪请求和事件：[数据流](data-flow.md)与[入口对账](entrypoints.md)。\n- 准备修问题：[代码审查](review.md)与[代码体检](health.md)。\n- 改完代码要同步文档：[维护流程](maintenance.md)。\n\n## 前端\n\n- [应用入口与主题](modules/frontend-shell.md)\n- [工作区画布](modules/canvas.md)\n- [聊天界面](modules/chat-ui.md)\n- [基础 UI 组件](modules/ui-primitives.md)\n- [历史原型与共享视图](modules/prototypes.md)\n\n## 控制面与运行时\n\n- [本地控制面](modules/control-plane.md)\n- [e 会话运行时](modules/e-runtime.md)\n- [Canvas 协作](modules/collaboration.md)\n- [审批与授权](modules/e-approvals.md)\n- [消息和附件](modules/message-content.md)\n- [herdr 兼容编排](modules/herdr.md)\n\n## 工程与资料\n\n- [开发、测试和运维](modules/development.md)\n- [Fumadocs 文档站](modules/documentation.md)\n- [调研与实验材料](modules/research.md)\n- [目录约定与迁移对照](repository-layout.md)\n- [未使用文件逐项复核](unused-files.md)\n\n## 这份文档的基线\n\n本次整理针对工作区当前内容，包含尚未提交的 e / Pi 功能。baseline 只标记当时的 HEAD，不声称这些改动已提交。每页来源哈希对应实际文件内容，校验不依赖文件是否已经提交。\n\n认领豁免仅用于上方列出的历史聊天验收说明、截图与验收产物；它们保留原位置，不作为架构模块。点文件、锁文件、二进制资产和架构派生目录由校验器自动豁免。研究文档与历史工具的迁移见[目录约定](repository-layout.md)，内容没有按当前实现改写。\n","maintenance.md":"---\ntitle: 文档维护\ndescription: 代码先行，审阅差异后更新 wiki，再重建站点与架构地图。\nsources:\n  - docs-site/scripts/unused-review.mjs 1d72f1c3bafd reconcileUnusedReview\n  - app/package.json 76486a23e156\n  - docs/architecture/verify.mjs f2b8209fece8\n  - docs-site/scripts/analyze.mjs 202ce7549c4a\n  - docs-site/scripts/prepare-content.mjs b3f5e68f66dc\n---\n\n# 文档维护\n\n## 一份事实源，两种阅读方式\n\n`docs/architecture/wiki/` 保存正文和证据。Fumadocs 页面由 `docs-site/scripts/prepare-content.mjs` 生成；它用 Markdown AST 转换站内链接，不修改代码块中的示例。`architecture.html` 使用 skill 的自包含模板，嵌入同一份 wiki 和静态图，不需要外部 CDN。\n\n两种输出都可以删除重建，不要在生成目录补写独立知识。正文要改在 wiki；架构图布局要改在 renderer，图上的模块标题、结构依赖和运行流说明仍从 wiki 或分析结果读取。\n\n## 修改代码后\n\n```bash\nnode docs/architecture/verify.mjs\n```\n\n先读来源差异。论断改变就改正文；只是注释或格式变化才保留正文。新文件归入对应模块的 covers，历史证据类文件可以说明理由后放进 index 的 exclude。\n\n本仓的校验器从 skill 模板复制，并扩展了认领对账：同时检查已跟踪和未跟踪、未忽略文件。这样能覆盖现有工作区的 e / Pi 新增文件，不需要为了校验执行 git add。校验脚本仍只依赖 Node 与 git。\n\n确认差异后执行：\n\n```bash\nnode docs/architecture/verify.mjs --sync\nnpm --prefix docs-site run architecture:analyze\nnpm --prefix docs-site run architecture:render\nnode docs/architecture/verify.mjs\nnpm --prefix docs-site test\nnpm --prefix docs-site run typecheck\nnpm --prefix docs-site run build\n```\n\n`--sync` 只刷新哈希和 baseline，不替你修正文。因为正文变动后旧地图 digest 会不匹配，第一次 sync 可能以非零退出；继续渲染，再跑 verify。若还有 symbol 消失、断链或认领错误，必须修复后才能构建。\n\n## 重新做体检\n\n`architecture:analyze` 使用 oxc，输入包含当前工作区源码。报告保存到 `docs/architecture/reports/`，每个零入度文件都有分类。当前 Knip 5 不支持 skill 要求的 `cycles` issue type，脚本保留原命令失败证据，再使用支持的 files/exports，循环另由静态图的强连通分量计算。\n\n未使用文件先按文件名和基础名搜索引用；动态 worker、类型声明和组件库可能是误报，不能一键删除。历史热点只按 Git 已提交记录计算，不反映尚未提交代码经历的修改次数。分析命令可能经 npx 获取 Knip 5，需要网络；文档的普通构建和 verify 不会运行 Knip。\n\nKnip 的动态入口、声明文件豁免和别名集中在 `app/knip.jsonc`，配置依据见 [Knip 配置文档](https://knip.dev/reference/configuration)。不要用全目录入口隐藏未使用组件。文件搬迁后，扫描与认领检查以实际存在的工作区文件为准，不要求先暂存 Git 改动。\n\n人工文件裁决保存在 `docs/architecture/unused-file-review.json`，不是 Knip 豁免名单。分析脚本复核保留项的 SHA-256 和当前候选集合；文件改动、删除或恢复后会提示重新复核。按职责阅读[逐项结论](unused-files.md)，不要把保护未提交工作误写成已有产品入口。\n\n## 检查入口\n\nAPI 编译启用 `noEmitOnError`，并和 ESLint 一起排除 `api/data/**`、`dist-api/**`。generation 内适配器属于运行数据，不是源码；检查不能让它引入外部 ADE 并向外部源码目录发射文件，也不能以清空用户数据解决编译问题。新增目录边界需同步 `tsconfig.api.json`、`eslint.config.js` 和回归测试。\n\n产品的 `npm --prefix app run lint` 在 ESLint 后调用 architecture:verify。文档站的 dev、typecheck、build 也先执行 verify；不会在构建时自动刷新来源哈希。\n\n构建产生 `.next/`、`.source/`、`content/docs/` 与 `public/architecture.html`，均已忽略。仓库中的 `docs/architecture/architecture.html` 与 `data.json` 则作为可检查的派生产物保留。\n\n## 保护已有工作\n\n不要为了整理文档重排业务目录、重写现有 README 的全部内容，或提交用户尚未确认的代码。原研究与验收文档保持原位置；这里用职责页索引它们。运行浏览器测试也不需要触发真实模型或重启日常使用的产品服务。\n","modules/canvas.md":"---\ntitle: 实时画布\ndescription: 将工作区图、终端与会话状态投影到可交互画布。\nsources:\n  - app/src/pages/canvas/GlobalCardViewControl.tsx 5eeacac098c7 GlobalCardViewControl\n  - app/src/pages/canvas/CardViewControl.tsx 2a0b6806cfd0 CardViewControl\n  - app/src/pages/canvas/ApprovalModeControl.tsx 1efcdfa82ded ApprovalModeControl\n  - app/src/pages/canvas/SessionHeaderActions.tsx ee6d5ea0e0ef SessionHeaderActions\n  - app/src/pages/canvas/contracts.ts 75be9b49a4d0\n  - app/src/pages/canvas/index.tsx 0c93d9ab6b59 CanvasPage CanvasRedirect computeTiers\n  - app/src/pages/canvas/live-store.ts 056a5d79638a LiveStore fetchWorkspaces sessionAction subscribeTerm\n  - app/src/pages/canvas/session-store.ts a1af822c02ec SessionStore capabilityAvailable\n  - app/src/pages/canvas/LiveNode.tsx 4465d81b5bb1 LiveNode LiveNodeComponent\n  - app/src/pages/canvas/LiveTerminal.tsx c93871702251 LiveTerminal EventReplay\n  - app/src/pages/canvas/SessionIdentity.tsx ce0ed7d1b0ab SessionIdentity SessionStatus\n  - app/src/pages/canvas/RunBar.tsx d2020529a6d3 RunBar\ncovers:\n  - app/src/pages/canvas/GlobalCardViewControl.tsx\n  - app/src/pages/canvas/global-card-view.css\n  - app/src/pages/canvas/SessionHeaderActions.tsx\n  - app/src/pages/canvas/ApprovalCard.tsx\n  - app/src/pages/canvas/ApprovalModeControl.tsx\n  - app/src/pages/canvas/CardViewControl.tsx\n  - app/src/pages/canvas/EApprovalCard.tsx\n  - app/src/pages/canvas/L0Summary.tsx\n  - app/src/pages/canvas/LiveChat.tsx\n  - app/src/pages/canvas/LiveEdge.tsx\n  - app/src/pages/canvas/LiveNode.tsx\n  - app/src/pages/canvas/LiveTerminal.tsx\n  - app/src/pages/canvas/RunBar.tsx\n  - app/src/pages/canvas/SessionControls.tsx\n  - app/src/pages/canvas/SessionIdentity.tsx\n  - app/src/pages/canvas/TracePanel.tsx\n  - app/src/pages/canvas/ZoneNode.tsx\n  - app/src/pages/canvas/canvas-context.ts\n  - app/src/pages/canvas/identity-window.css\n  - app/src/pages/canvas/index.tsx\n  - app/src/pages/canvas/live-store.ts\n  - app/src/pages/canvas/contracts.ts\n  - app/src/pages/canvas/mock-server.ts\n  - app/src/pages/canvas/session-identity.ts\n  - app/src/pages/canvas/session-store.ts\n  - app/src/pages/canvas/utils.ts\n---\n\n## 职责\n\n把一个工作区的运行状态呈现在画布上，并把用户的操作交给后端。真实 e 会话显示对话窗口，herdr 节点显示终端；它们共用布局、缩放、分区和专注窗口。画布本身不启动本机 Agent 进程，也不把演示状态当成真实运行结果。\n\n本页覆盖的文件超过 20 个，但职责仍集中在工作区的实时画布适配。对话内容与输入规则单列在[会话交互](chat-ui.md)，跨画布的显示组件单列在[画布原型与共享呈现](prototypes.md)。\n\n## 对外接口\n\n| 接口 | 定义位置 | 调用方与用途 |\n| --- | --- | --- |\n| `CanvasPage`、`CanvasRedirect` | `app/src/pages/canvas/index.tsx` | 路由分别打开指定工作区，或从工作区列表选择活跃项后跳转。 |\n| `LiveStore` | `app/src/pages/canvas/live-store.ts` | 持有图、连接状态、事件和终端订阅；封装 `/ws` 与 `/api`。 |\n| `SessionStore`、`capabilityAvailable` | `app/src/pages/canvas/session-store.ts` | 按节点订阅 `SessionView`；同工作区只接收更高版本，能力还须满足 ready、authoritative、available 与未过期。 |\n| `LiveNode` | `app/src/pages/canvas/LiveNode.tsx` | 根据节点后端选择对话或终端内容，接入共享专注窗口。 |\n| `LiveTerminal` | `app/src/pages/canvas/LiveTerminal.tsx` | 订阅 ANSI 全量快照；输入走工作区限定的节点端点。 |\n| `SessionIdentity`、`SessionStatus` | `app/src/pages/canvas/SessionIdentity.tsx` | 展示身份与会话状态；昵称更新提交 `title` 和 `expectedVersion`。 |\n\n`LiveStore.sessionAction` 接受 `messages`、`abort`、`approval`、`stop`、`resume`、`configuration`、`queue`。请求落在 `/api/workspaces/:wid/nodes/:nid/:operation`；没有工作区标识时使用旧节点路径。e 操作要求连接在线，响应中的会话快照回写 `SessionStore`。\n\n`contracts.ts` 独立承载图与消息类型，真实 store 和 mock 共同依赖它；store 保留类型转导出，避免一次改动所有调用方。\n\n## 数据怎么流\n\n打开工作区后，浏览器建立同源 WebSocket，先声明要查看的工作区。收到全量图后建立节点、边和分区，再按增量更新局部状态。消息带有工作区、代次和序号时，客户端过滤错工作区和旧帧；发现序号缺口就重新请求全量图。连接失败会退避重连，保留最后快照。\n\n真实会话的消息历史通过独立的会话快照更新，不必每次重建整张图。终端快照按节点分发；前三个活窗实时更新，第四个按半秒抽帧，其余显示最后快照，专注窗口提升为实时显示。终端键入内容提交给后端，屏幕回显仍以后端快照为准。\n\n标题中的状态与上下文共用一个圆形入口：正常且数据有效时显示真实用量环与百分比，悬停或焦点只提示当前状态和查看详情的动作，完整用量、时间和原因在点击弹层中说明；异常时同一位置切换为红色状态，不并列旧百分比。等待审批仍有明确提示，不从“中断”等字样猜测故障。没有错误证据的待恢复记录用中性色，真实运行器失败或降级保留告警。详细节点与专注标题栏只保留身份、状态和操作入口；普通待恢复或已停止会话直接在标题栏提供恢复，不重复占据正文通知块。卡片视图选择与诊断放在会话菜单，历史模型在输入台与会话详情中明确标为上次使用。缩略卡没有输入台，仍保留模型摘要。\n\n拖动节点先改变本地位置，拖动结束再提交位置数组。一键布局请求由后端计算，返回的节点补丁更新图。昵称修改附带用户开始编辑时的版本；遇到冲突时保留草稿，更新已知版本后等待用户重试。\n\n演示回退有明确条件：列表请求失败且地址带演示参数时才返回本地示例。画布连接回退还要求先前已确认是演示源、非 e 后端，并且连续握手失败两次。首次完全离线时，画布默认来源仍是真实源，不会凭空生成演示图。以上行为以 `live-store.ts` 的实现为准，文件头的旧注释比实际条件宽。\n\n输入台权限入口只显示当前模式图标：手动为盾牌，辅助为带勾盾牌，Full Access 为警示盾牌。菜单展示三种图标、说明和已选状态；风险模式仍有明显色调、可聚焦说明及启用前确认，审批授权逻辑不变。模型、状态和权限入口的自绘 hover 提示采用同一视觉样式，不再同时叠加原生 title；弹层打开时隐藏对应 hover 提示。\n\n`GlobalCardViewControl` 将全局默认选择器挂到 `App` 的配色旁。全局值跨当前浏览器同源主画布生效；单卡有 inherit/auto/compact/detail 四种设置。全局变化保留单卡覆盖，只有明确点击“本画布全部跟随全局”才清除当前 workspace 的覆盖，不影响其他画布。\n\n`SessionHeaderActions` 组合原有 `SessionControls`、`CardViewControl` 与浮出菜单。诊断开关由 `LiveNode` 持有，传给 `LiveChat`；诊断关闭后的焦点返回当前标题栏入口。不会重建聊天内容容器或触发隐式恢复。\n\n昵称编辑旁有复制按钮，复制共享的名字与完整 hash 引用；同画布补全排除自己。真实通信边使用独立类型、方向和状态标签，读取与消息分道避免重叠；点击只显示该关系的持久化记录，不混入节点全部事件。没有操作时不因提及产生连线，细节见 [Canvas 协作](collaboration.md)。\n\n## 改动指南\n\n- 新增消息类型先改 `contracts.ts` 的 `ServerMessage` 与 `live-store.ts` 的分发逻辑，再决定通知图订阅者、单节点订阅者还是会话订阅者；不要让每个 token 都触发整图布局。\n- 修改连接恢复时，要同时检查 `LiveStore.connect`、`subscribeTerm` 和 `LiveTerminal` 的订阅 effect。新连接和序号缺口重同步收到完整图后，会恢复仍有订阅者的 herdr 终端；e 会话不走这条恢复路径。\n- 调整布局看 `index.tsx` 的拖拽位置缓存、`resetSeq`、`layoutSeq` 和 `computeTiers`。一键布局后的适应视图 effect 显式依赖布局序号，等待节点补丁渲染后重新适配视口。\n- e 会话操作使用 `sessionAction`，不要复用允许空后端静默返回的旧 `run`、`reset`、`sendInput` 路径。\n- 昵称冲突处理在 `SessionIdentity.tsx`；保留 `expectedVersion` 和工作区、节点身份校验，不能用最后写入覆盖冲突。\n","modules/chat-ui.md":"---\ntitle: 会话交互\ndescription: 真实 e 会话的消息呈现、草稿、待发队列和审批操作。\nsources:\n  - app/src/pages/canvas/chat/runtime-config-presentation.ts be479d7748ab configurationBasis thinkingLevels configurationBlockReason modelGroups\n  - app/src/pages/canvas/chat/ChatPopover.tsx 8cb0cb4f5108 ChatPopover ChatConfirm\n  - app/src/pages/canvas/chat/TurnView.tsx c432454866a7 TurnView\n  - app/src/pages/canvas/chat/SessionNotice.tsx 8f1c327919b2 SessionNotice\n  - app/src/pages/canvas/chat/Composer.tsx 1ad5040fd7a3 Composer\n  - app/src/pages/canvas/chat/chat-ui-store.ts 14e88309fb3c ChatUIStore chatUIKey getChatUI\n  - app/src/pages/canvas/chat/project-transcript.ts dac1133a32dd TranscriptProjector\n  - app/src/pages/canvas/chat/ConversationView.tsx 09774f4577f6 ConversationView\n  - app/src/pages/canvas/chat/ApprovalRequest.tsx d475ac074d32 ApprovalRequest\n  - app/src/pages/canvas/chat/presentation-state.ts 532eb264b29f presentation sessionNotices\n  - app/src/pages/canvas/chat/attachments.ts 2eba1c6a1bc5 readAttachment pastedAttachment\n  - app/src/pages/canvas/chat/error-presentation.ts 9bf76cd37b66 redact safeLink\n  - app/src/pages/canvas/chat/RuntimeConfigControl.tsx 18eac6869cc9 RuntimeConfigControl\ncovers:\n  - app/src/pages/canvas/chat/\n---\n\n## 职责\n\n让用户在真实会话里读消息、写草稿、查看工具执行并决定审批。界面区分会话生命周期、当前轮状态、审批状态和操作结果未知，不能把“请求已发出”显示成“执行已成功”。\n\n文件数超过 20 个，仍按同一职责归为一页：它们共同实现一份会话快照到可读、可操作对话界面的转换。网络传输和快照版本控制归[实时画布](canvas.md)。\n\n## 对外接口\n\n- `Composer`（`app/src/pages/canvas/chat/Composer.tsx`）接收会话视图、画布 store 与本地 UI store，通过 `automaticDelivery` 自动提交普通消息或 Canvas 待发队列操作；输入台不再手选发送方式。Steer 从 `QueuePanel` 的立即发送入口显式触发，Follow-up 只保留底层 API 兼容。\n- `ConversationView`（`ConversationView.tsx`）读取 `SessionView.snapshot`，通过 `TranscriptProjector`（`project-transcript.ts`）生成稳定的对话轮次，再渲染消息、工具与审批。默认展示末尾 30 条，每次向前加载 30 条。\n- `ChatUIStore`、`getChatUI`（`chat-ui-store.ts`）管理草稿、附件、发送意图、展开状态和阅读位置。`chatUIKey` 包含工作区、节点与原生会话标识，避免串会话草稿。\n- `presentation`、`sessionNotices`（`presentation-state.ts`）由会话事实、连接状态、只读状态和能力有效期计算可操作状态。`needsSessionRecovery` 区分无故障证据的待恢复记录；`sessionModelPresentation` 为会话详情和输入台统一提供当前或历史模型标签；`sessionIndicator` 为统一状态球选择真实上下文或优先显示的异常状态。\n- `ApprovalRequest`（`ApprovalRequest.tsx`）提交带 `intentId`、`approvalId`、`decision` 的审批；`RuntimeConfigControl`（`RuntimeConfigControl.tsx`）提供同一弹层中的推理主面板与模型列表，提交带 `expectedRevision` 的执行配置变更，或请求重新回读配置。`runtime-config-presentation.ts` 提供真实档位名称、配置基准、模型分组和可写条件。\n- `readAttachment`、`pastedAttachment`（`attachments.ts`）形成契约中的 base64 附件；约束检查复用 `app/shared/message-content.mjs`，会话类型来自 `app/api/e/contracts.ts`。\n\n## 数据怎么流\n\n服务端会话快照先按实体标识和修订号去重，再把助手消息按轮次合并。工具调用与结果只呈现一次，有明确轮次或父消息的工具放回对应位置；无法关联的工具和审批单独显示，避免猜测归属。\n\n用户输入保存在当前会话的浏览器会话存储中，有效期为 24 小时。附件二进制只保留在内存，刷新后恢复附件名称并阻止发送，直到用户重新选择附件或明确移除缺失标记。超过 2000 字符的粘贴文本转成文本附件。\n\n发送时重新读取最新会话状态，并创建稳定的意图标识。普通输入在当前轮执行中、等待审批、已有待发项或会话停止、中断时进入 Canvas 待发队列；空闲且具备能力时作为新消息直接发送。不存在隐藏的手动 Steer/Follow-up 选择。待发摘要直接提供首项编辑和立即发送；运行中立即发送必须确认 Steer，不自动中断。队列修改附带修订号，消息发送附带投递方式。失败时保留草稿，不自动重发；成功后只有草稿修订未改变才清空，避免删掉提交期间的新输入。\n\n尚未恢复且没有运行器错误或降级证据的记录在标题栏使用中性状态与显式恢复按钮，正文不再重复普通恢复通知，不能仅凭中断生命周期宣称运行器故障，也不推测中断原因。旧快照中的执行中轮次不表示当前仍在运行；独立的审批和未知动作仍需保留。恢复前的普通消息只保存到暂停队列，不授权执行；只有明确恢复会话并恢复待发后才继续。\n\n模型记录与已确认配置都不能在会话未就绪、离线或配置未确认时冒充当前回读。此时入口明确显示上次使用的模型。上下文从输入台移到标题状态球，只有同 native 的就绪会话、有效容量与真实用量才显示环形百分比；无数据不估算。异常、配置未确认、未知派发、离线和暂停状态不显示过时百分比；点击状态球可看状态和真实采样时间。\n\n审批按钮只有在连接在线、工作区可写、能力有效且请求仍待审批时可用。配置切换也等待运行器回读确认；切换提供方前显示确认框，当前轮执行中不能修改配置。推理滑条按运行器返回的离散档位排列，拖动先预览，松开或键盘 Enter 后提交一次；输入台摘要在回读前保持已确认值。预览绑定 native、模型、revision 和档位集合，过期预览拒绝提交。选模型后重新读取实际档位，运行器发生调整会说明，不默认最高档。只有一个或没有可调档位时不显示无效滑条。错误和工具输出显示前做脱敏，原始会话证据不被界面改写。\n\n消息尾部默认只保留复制、时间与详情入口；真实消息模型仍保存在详情及原始元数据中。执行配置由输入台承担，不能把历史回复的模型替换成当前选择。\n\n模型列表按真实 provider 分组，可搜索名称和 ID，没有静态推荐模型或虚构默认选项。取消跨 provider 确认回到模型列表；Esc 按详情、模型列表、推理面板和外层窗口逐层返回。刷新按钮只是重新读取配置，不修改 Pi 全局默认。\n\n输入框的 `useAgentMentions` 弹层按光标附近的查询提供同画布其他真实 Agent，支持名称或 hash 过滤、方向键、Enter/Tab、Esc 和 IME。选择只替换引用所在片段，不重建输入框、不提交消息、不改变投递意图。消息引用语法与服务器共用实现。来自受管 Agent 的待发消息标明来源，不允许改写后继续冒充发送方；可明确删除或控制队列。\n\n## 改动指南\n\n- 对话顺序或工具归属问题先看 `TranscriptProjector.project`。保留稳定实体标识和未关联活动，不用数组下标代替业务身份。\n- 新增发送方式必须同时修改 `Composer`、`presentation` 和后端能力契约。不能只开放按钮绕过能力有效期、归档限制或配置未确认状态。\n- `ChatUIStore.beginAutomatic` 固定普通输入为 nextTurn，并保留未确认意图的目标通道。重试时不能因状态变化将同一未确认输入从消息改成队列或反向派发；旧版没有目标记录的未确认草稿阻止重新解释，要求核实。旧的模式偏好不会驱动新输入台。改草稿清理逻辑时继续保留 revision 与稳定 intent 检查。\n- 附件支持范围由 `readAttachment` 和共享校验共同决定。浏览器报告的 `text/markdown`、`text/x-markdown`、`text/csv` 和纯文本会统一为 `text/plain`；只有空 MIME 才按文本扩展名回退，不把已声明的二进制 MIME 当成文本。\n- 链接安全由 `safeLink` 限定为无内嵌账号密码的 HTTP(S) 地址；`redact` 只是显示层脱敏，不能作为服务端秘密管理或完整数据清洗方案。\n","modules/collaboration.md":"---\ntitle: Canvas 协作\ndescription: 同画布 Agent 引用、受管工具、文本产物、消息队列与可核验通信边。\nsources:\n  - app/shared/collaboration-protocol.mjs c6b8d152216f COLLABORATION_CONTRACT collaborationReady validateCollaborationArgs validateCollaborationResult\n  - app/shared/collaboration-package.mjs bbcc71c2fceb readCollaborationPackage\n  - app/scripts/canvas-channel.mjs 423b626ff829\n  - skills/canvas-collaboration/SKILL.md ba3eaae46f56\n  - app/api/e/collaboration.ts 096ce14475bf CollaborationStore\n  - app/api/e/collaboration-authorization.ts 26a34844b106 authorizeCollaboration\n  - app/api/e/collaboration-contracts.ts e54a2cc5f043 CommunicationRecord\n  - app/api/e/message-origins.ts 2167cd9ebfec associateMessageOrigins orderedMessages\n  - app/scripts/canvas-adapter.mjs b0965c80795c prepareCanvasAdapter\n  - app/scripts/canvas-tools.mjs ca0839f2ed5a install\n  - app/src/pages/canvas/CommunicationTrace.tsx e5b7550444b7 CommunicationTrace\n  - app/src/pages/canvas/use-agent-identities.ts 8526c53bb917 useAgentIdentities\n  - app/shared/agent-reference.mjs bbb0ad9222b4 sessionIdentities resolveAgentReference\n  - app/api/e/session-manager.ts f1a051ecac53 SessionManager\n  - app/api/routes.ts 7cbd733eaf33 applyCommunications\ncovers:\n  - app/scripts/canvas-channel.mjs\n  - app/scripts/collaboration-inspect.mjs\n  - skills/canvas-collaboration/\n  - app/api/e/collaboration.ts\n  - app/api/e/collaboration-authorization.ts\n  - app/api/e/collaboration-contracts.ts\n  - app/api/e/message-origins.ts\n  - app/scripts/canvas-adapter.mjs\n  - app/scripts/canvas-tools.mjs\n  - app/src/pages/canvas/CommunicationTrace.tsx\n  - app/src/pages/canvas/use-agent-identities.ts\n  - app/src/pages/canvas/collaboration.css\n  - app/scripts/demo-quant-canvas/\n  - app/test/unit/quant-canvas-demo.test.mjs\n  - docs/guides/QUANT_CANVAS_DEMO.md\n---\n\n# Canvas 协作\n\n## 职责\n\n让同一画布的真实会话能引用彼此，由会话内的 Agent 决定读取同伴的已完成回复、发布或读取文本产物、发送必要消息。引用本身只改草稿，不投递消息。图上的通信关系来自实际读取或发送记录，和旧版依赖调度不同。\n\n产物不是任意磁盘文件：这里只共享明确发布的不可变文本，以及已完成的助手文本回复，不读取思考块、工具日志、路径、远程链接或凭据。其他 Agent 的内容是任务数据，不能成为新的用户授权。\n\n## 对外接口\n\n- `app/scripts/canvas-tools.mjs` 注册 `canvas_agents`、`canvas_read`、`canvas_publish`、`canvas_send`，工具定义来自共享契约；独立 `skills/canvas-collaboration/SKILL.md` 由 worker 显式加载并绑定到系统指令，不依赖全局自动发现，也没有公开 HTTP 发送接口。\n- `prepareCanvasAdapter` 在当前会话 generation 目录生成 ADE 适配器的本地副本，只扩展审批工具名单并重定位相对导入；原 ADE 保持只读。过渡审批锚点不匹配时停用协作并回退原适配器，普通聊天继续，绝不启用无审批的协作。四个 Canvas 工具均走原有 e 审批，辅助模式默认转人工，Full Access 遵循用户现有的会话授权；不新增审批白名单或精确授权种类。\n- `authorizeCollaboration` 先要求完整就绪证据与版本化请求，再核对父 IPC 绑定的活动 worker、同 native 快照、正在执行的工具、完整参数与已批准的审批。`CollaborationStore.execute` 校验参数、同画布目标、自引用、配额和幂等回执。\n- `sessionIdentities` / `resolveAgentReference` 使用共享 `@\"昵称\"#hash` 引用；名字仅描述，hash 负责定位。重名、NFC、转义字符和 hash 冲突有确定性处理；过期或歧义引用拒绝，不猜名字。\n- `CommunicationTrace` 只读该关系的最近 50 条记录。`applyCommunications` 把持久化记录投影为 `kind:'communication'` 边，通过现有图补丁通道广播。\n\n## 资源包与就绪证据\n\n`collaboration-protocol.mjs` 统一参数、结果 schema、错误码、审批要求与预算；Pi TypeBox 和 API 校验都从它派生。`collaboration-package.mjs` 校验受管 Skill 的 id/version，计算契约、Skill 与 bundle 摘要。独立 Skill 是模型指导，不是授权或模型必然遵从的证明。\n\nAPI 传期望 manifest，worker 独立校验，扩展通过实际 SDK 命令/工具列表报告发现结果；`canvas-channel.mjs` 私有 hello/welcome 仅在版本/摘要、Skill 发现、四工具与系统指令绑定模式齐备后报告 ready。旧布尔值或本地资源存在不算就绪。旧父 API 没有 manifest 时保留普通聊天；超时、断线、漂移或不兼容撤销协作，未知调用不重试。\n\n既有状态球详情展示此证据与版本，离线只展示历史信息。`collaboration-inspect.mjs --skill|--schema|--manifest` 是只读包检查入口，不能用来发送消息，也不报告某会话已加载。\n\n## 数据怎么流\n\n用户复制昵称旁的引用，或在输入框输入提及符号选择其他会话，只会插入文本。会话 Agent 看到任务后选择是否调用协作工具；没有隐藏的广播或自动发送。\n\n工具先经过现有审批，再通过不可被子命令继承的私有文件描述符送到 worker，worker 通过父子 IPC 请求控制面。调用方身份来自进程绑定，不取自参数和正文。控制面等待相应的核心工具与审批证据到达，校验一致后才处理。\n\n读取返回有来源和完整文本摘要的结果，截断会明确标记，并落一条读取记录。发布保存不可变文本。发送先写操作意图，再向目标的现有待发队列加入带受管来源的消息，最后保存回执。目标忙时等待空闲；停止、用户暂停或重启暂停的目标不会被自动唤醒或解冻。初始未授权的空队列只在目标已就绪且本次发送已获批准时获得继续授权。\n\n队列状态才是消费事实：核心观察到精确输入元组才显示已消费，模型回复与任务成功是另一件事。结果未知不自动重试。重启保留回执、产物和通信记录，重新投影连线；恢复会话和恢复队列是两个明确操作。\n\n可信输入来源先由真实动作应用事件与观察消息关联。历史重放改变消息 ID 时，只用先前记录的同原生会话、时间与完整内容摘要精确唯一匹配恢复标签；不能从正文中的名字认人。没有先前绑定、时间或内容不同、观察不可信、重复元组时维持来源未知。最新结果按真实消息时间选取，不能按快照数组末项猜测。\n\n## 改动指南\n\n- 服务错误统一为 code/message/retryable:false；e 审批拒绝仍由原审批通道表达。不要把错误编码成成功结果或自动重试未知投递。包边界回归见 `collaboration-package.test.mjs` 与 `collaboration-package.spec.ts`。\n\n- 先看 `collaboration-authorization.ts` 与 `session-manager.ts` 的 `collaboration` IPC 分支；不要接收可由浏览器指定的 Agent 来源、跨工作区目标或任意文件路径。\n- `collaboration.json` 位于会话数据根目录，写临时文件后重命名。回执 key 包含 workspace/native/toolCallId；签名不同拒绝复用，未完成意图不重放。损坏账本拒绝重置，不自动删历史。\n- 正文和文本产物最多 12000 个 JS 字符单位且 UTF-8 ≤16 KiB；读取最多返回 12000 字符并注明截断。每 Agent 100 个产物、全局 1000 个；通信记录 5000 条、回执 10000 项，达到上限明确拒绝。\n- 发送另限每 Agent 每分钟 10 次、每运行轮次 8 次；Agent 消息链最多 4 跳、16 条。链路取受管输入来源，不相信正文声称来自人类。需要更多协作时回到用户新任务，不自动重置预算。\n- Agent 来源待发可删除、排序、暂停、明确立即发送，但不可改写正文后继续使用原 Agent 身份。普通用户队列行为不变。\n- 图上的方向表示操作发起方到目标；读取和发送独立分道，标签可键盘访问，不用源节点活动动画推断通信中。连线只是观测，不执行 DAG 调度、自动建会话或 Git 合并。\n- 检查入口：`app/test/unit/collaboration.test.mjs`、`message-origins.test.mjs`、`app/test/browser/collaboration.spec.ts`；显式 opt-in 真实闭环脚本为 `app/test/manual/real-collaboration.mjs`，每次使用独立临时目录和会话，真实验收边界见仓库文档 `docs/canvas-collaboration.md`。\n","modules/control-plane.md":"---\ntitle: 本地控制面\ndescription: HTTP、WebSocket 与工作区持久化的共同边界。\nsources:\n  - app/api/index.ts fb665635c747\n  - app/api/routes.ts 7cbd733eaf33 wireBroadcasts wsHandlers api\n  - app/api/registry.ts 4ccc91d72dac registry\n  - app/api/graph.ts a974124ec7cf GraphStore onAnyPatch\n  - app/api/layout.ts 40f95704ade7 computeLayout\n  - app/api/local-access.ts 160bda3f88d5 localRequestAllowed\n  - app/api/runtime-router.ts 16802d8055c1 requireHerdr runtimeRouter\n  - app/api/types.ts 34f2642691f5 CanvasNode ServerMessage ClientMessage\n  - app/api/workspace-paths.ts d251249d59c7 PROJECT_ROOT migrateLegacySeedPath\ncovers:\n  - app/api/index.ts\n  - app/api/routes.ts\n  - app/api/registry.ts\n  - app/api/graph.ts\n  - app/api/layout.ts\n  - app/api/local-access.ts\n  - app/api/runtime-router.ts\n  - app/api/types.ts\n  - app/api/workspace-paths.ts\n  - app/api/graphs/\n---\n\n# 本地控制面\n\n## 职责\n\n控制面把浏览器操作交给相应后端，保存工作区和画布坐标，再把变化推回当前工作区的订阅者。真实 Agent 会话与旧版终端编排共用入口，但不能互相调用对方的运行控制。服务只监听本机地址，并检查请求的目标主机和浏览器来源。\n\n工作区记录与画布状态由服务管理。会话消息由独立的运行时模块保存，画布只投影会话身份和状态；它不是会话历史的事实源。\n\n## 对外接口\n\n- `app/api/index.ts` 挂载 `/api`、升级 `/ws`，并托管 `app/dist/`。静态文件不存在时回退到首页；尚未构建首页则返回 404。\n- `app/api/routes.ts` 的 `api` 提供工作区创建、查询、重命名、归档、布局及后端控制。`/api/e/*` 已退役，返回 410。旧 `/api/graph` 与 `/api/nodes/:id/*` 仍按活动工作区解释，新调用应使用 `/api/workspaces/:wid/...`。\n- `wsHandlers` 接收 `hello`、`term.subscribe`、`term.unsubscribe`。`hello` 切换工作区时清理旧终端订阅，并重置 `generation` 与 `sequence`。发送内容包括完整图、节点或边补丁、会话、事件和终端快照；消息契约见 `app/api/types.ts`。\n- `app/api/registry.ts` 的 `registry` 管理工作区，默认写入 `app/api/data/workspaces.json`，可通过 `CANVAS_DATA_DIR` 改位置。写入采用临时文件后重命名。首次无有效记录时从 `app/api/graphs/` 的 JSON 示例初始化。\n- `app/api/graph.ts` 的 `GraphStore` 管理单个工作区的图；`onAnyPatch` 供广播订阅。`app/api/layout.ts` 的 `computeLayout` 使用最长路径分层和重心排序，不调用 dagre。所有边（含真实通信边）都参与布局，Zone 不决定列。\n- `localRequestAllowed` 限制本机 Host 与允许端口；`runtimeRouter` 与 `requireHerdr` 拒绝对真实会话工作区执行旧版图运行和终端输入。实现分别在 `app/api/local-access.ts`、`app/api/runtime-router.ts`。\n\n## 数据怎么流\n\n创建工作区时，入口先校验字段，再根据后端决定初始画布。真实会话工作区固定使用项目根目录和空图；旧版终端工作区必须提供图。保存成功后，浏览器取得工作区标识。后续读取会更新内存中的活动工作区，旧版兼容入口也随之改变目标。\n\n浏览器建立长连接后先选择工作区，服务返回完整画布；真实会话工作区还会收到每个会话的当前视图。节点变化只发给订阅该工作区的连接。拖动布局会先验证全部坐标和节点，再逐个更新并持久化。自动布局沿用同一补丁广播路径。\n\n重启时，旧版终端图会清理进程标识、进度和运行状态，避免把已经结束的进程当成仍在运行。真实会话图则根据持久化会话视图重新投影。归档先标记只读，再停止该工作区下的真实会话；不删除历史。上述处理分别见工作区注册表与路由的启动广播接线。\n\n协作记录由会话管理器发出通信变化事件，路由将其投影为边补丁；重启先重建会话节点，再从独立账本重建通信边。没有公开的跨 Agent 发送 HTTP 接口，身份绑定走私有 worker 通道，见 [Canvas 协作](collaboration.md)。\n\n## 改动指南\n\n改请求字段先看 `app/api/routes.ts` 的 Zod schema，再核对 `app/api/types.ts` 和调用方。新增写接口必须检查工作区归属、后端类型及 `registry.assertWritable`；停止会话允许用于已归档工作区，以便收尾。\n\n新增广播使用明确的 `workspaceId`。事件生产者直接记录 `workspaceId`，广播使用该归属，REST 历史与消息速率同时按工作区和节点过滤。兼容 `/nodes/:id/events` 限定当前活动工作区，详见[旧版终端编排](herdr.md)。\n\n改存储位置或示例迁移先看 `app/api/workspace-paths.ts`。`PROJECT_ROOT` 不依赖启动目录，`migrateLegacySeedPath` 只迁移三组精确匹配的历史示例，不能批量替换用户路径。API 模块导入会初始化注册表；测试前应先设置独立的数据目录。\n","modules/development.md":"---\ntitle: 启动与验证\ndescription: 本地启动器、编译检查和分层测试的维护入口。\nsources:\n  - app/knip.jsonc 5f091132ff40\n  - app/package.json 76486a23e156\n  - app/scripts/dev-e.mjs 82c22e9d56a3\n  - app/scripts/e-control.mjs ed63498cbe6f controlSession\n  - app/scripts/agents/data-process.sh 29d20304546c\n  - app/playwright.config.ts 82f0d7dd0bc7\n  - app/test/browser/real-e.spec.ts 63f88818ee13\n  - app/test/unit/e-routes.test.mjs a1d8431a9269\n  - app/Dockerfile 935d7addc86d\n  - app/tsconfig.api.json 3ef105e6ff0c\n  - README.md ffed4273ee8d\n  - docs/guides/E_BACKEND.md cc566f02080e\ncovers:\n  - app/package.json\n  - app/eslint.config.js\n  - app/knip.jsonc\n  - app/tsconfig.json\n  - app/tsconfig.api.json\n  - app/playwright.config.ts\n  - app/Dockerfile\n  - app/README.md\n  - app/info.md\n  - app/test/\n  - app/scripts/dev-e.mjs\n  - app/scripts/e-control.mjs\n  - app/scripts/agents/\n  - README.md\n  - docs/README.md\n  - docs/guides/RUNBOOK_WSL.md\n  - docs/guides/E_BACKEND.md\n  - docs/guides/E_INTEGRATION_VERIFICATION.md\n---\n\n# 启动与验证\n\n## 职责\n\n这一页负责开发者从安装依赖到验证改动的操作边界。测试与启动配置虽然分散在多个目录，维护目标相同：本地服务应使用独立端口和数据目录，普通检查不能误启动真实模型任务，历史验收记录也不能充当本次通过的证据。\n\n## 对外接口\n\n以下命令在 `app/` 中执行，脚本事实源是 `app/package.json`。\n\n| 命令 | 用途 |\n| --- | --- |\n| `npm run dev:e` | 加载本地配置，同时启动 API 和 Vite |\n| `npm run start:e` | 检查构建产物后启动生产单服务 |\n| `npm run dev` / `npm run dev:api` | 单独启动前端或 API；需要自行对齐端口 |\n| `npm run build` | TypeScript 项目构建与 Vite 打包 |\n| `npm run build:api` | 依据 `app/tsconfig.api.json` 编译 API 到 `dist-api/` |\n| `npm run lint` | ESLint 检查 |\n| `npm test` | 通过 tsx 执行 `app/test/unit/*.test.mjs` |\n| `npm run test:e2e` | 执行 `app/test/browser/` 的 Playwright 用例 |\n\n`app/scripts/dev-e.mjs` 读取 `app/.env.e`，默认 API 端口 3300、前端端口 5173；端口已占用即失败，不借用别的服务。它通过 `/api/runtime/status` 检查启动结果，子进程退出后会收尾其他子进程。\n\n`app/scripts/e-control.mjs` 导出 `controlSession`，供私有运行时 worker 使用，不能当成独立命令运行。它获取控制依据，验证 authoritative capability 与有效期，携带会话修订号和幂等标识发消息、取消运行或处理审批；只对 `STALE_STATE` 再取一次依据并重试。\n\n`app/playwright.config.ts` 默认启动 5189 端口的 Vite，也可用 `CANVAS_TEST_URL` 指向指定实例。`app/test/browser/real-e.spec.ts` 只有设置 `CANVAS_REAL_E2E=1` 才运行真实模型用例；该用例会创建工作区、发送消息并验证恢复前后的 native session 一致。\n\n## 数据怎么流\n\n日常启动先检查本地配置和端口，再启动前后端。开发模式的浏览器请求经前端代理送往 API；生产模式由 API 同时提供网页和接口。关闭启动器时先向子进程请求退出，超时后才强制结束。\n\n单元测试直接导入模块，用临时目录和测试替身隔离持久化或外部运行时；路由测试可直接向路由实例发请求，无须启动监听端口。浏览器用例分为界面 fixture 和显式启用的真实会话验收，前者验证界面行为，不能证明模型确实执行了任务。\n\n旧版演示脚本由终端调度器调用，通过运行目录写入进度、审批标记和消息，等待标准输入继续或中止。它们会产生演示结果，不能用于证明真实 Agent 能力。\n\n## 改动指南\n\n本地真实会话前提和参数见 `docs/guides/E_BACKEND.md`；其 Node 要求是 22.13 以上，且需要已有 ADE/Pi 依赖。`app/Dockerfile` 仍是 Node 20 的旧版容器入口，`app/README.md` 与 `app/info.md` 也保留脚手架说明，不能据此推断真实 e 后端已支持容器部署。\n\n改端口时同时核对启动器、前端代理和控制面的来源校验。改 API 编译输出时注意 `tsconfig.api.json` 仅编译 API TypeScript；示例 JSON、运维脚本和外部运行时依赖不能假设会自动复制进输出目录。\n\n新增测试优先沿用 `app/test/unit/e-routes.test.mjs` 的临时目录隔离模式。运行真实用例前明确指定独立实例；历史 `docs/guides/E_INTEGRATION_VERIFICATION.md` 和 UI 证据中的端口、测试计数只是当时记录。不要为了验收重启用户已有服务，也不要把带自动审批的历史脚本加入默认测试入口。\n","modules/documentation.md":"---\ntitle: Fumadocs 文档站\ndescription: 独立的 Landing Page、模块文档、全文搜索和可重建架构地图。\nsources:\n  - docs-site/package.json 74b39960b4a2\n  - docs-site/app/page.tsx 36679c3b44c5\n  - docs-site/source.config.ts 3a15674e4ae4\n  - docs-site/scripts/prepare-content.mjs b3f5e68f66dc\n  - docs-site/scripts/render-architecture.mjs b08e9cda3907\ncovers:\n  - docs-site/\n---\n\n# Fumadocs 文档站\n\n## 职责\n\n为读代码的人提供入口：首次运行、理解模块、追踪调用、查找问题。文档站独立于产品，不连接真实会话，不读取本机凭据，不把产品的工作区首页改成宣传页。\n\n## 对外接口\n\n- `docs-site/app/page.tsx` 提供 Landing Page，画布示意明确标注为非实时状态。\n- `docs-site/app/docs/[[...slug]]/page.tsx` 使用 Fumadocs 的正文、目录与页间导航。页面底部可展开来源文件和 blob 哈希。\n- `docs-site/app/api/search/route.ts` 从同一内容源建立全文索引；`RootProvider` 提供搜索对话框和主题切换。\n- `docs-site/source.config.ts` 定义 frontmatter，`lib/source.ts` 提供页面树。\n- `docs-site/scripts/prepare-content.mjs` 校验后转换 wiki，`render-architecture.mjs` 从模板重建独立 HTML，`analyze.mjs` 生成静态图与体检报告。\n\n## 数据怎么流\n\n启动或构建时，先检查正文来源与地图是否过期。检查通过后，把 Markdown 转为站内文档内容，重写相对链接并生成导航。文档框架编译正文，同时提取标题、目录和搜索索引。浏览器请求正文或搜索时，只访问这份静态知识，不访问应用会话。\n\n架构地图从同一份 wiki 读取模块名和运行流，按代码静态导入聚合模块依赖。它将正文与数据一起嵌入单文件，断网也能查看。\n\n## 改动指南\n\n改内容编辑 `docs/architecture/wiki/`；改首页编辑 `docs-site/app/page.tsx` 与 `global.css`。链接转换使用 AST，新增规则需要在 `scripts/content-links.test.mjs` 补测试。不要直接改 `content/docs/`。\n\n站点使用独立 package 和锁文件，避免将 Next、Tailwind 4 或 Fumadocs 混入产品的 Vite/Tailwind 3 依赖树。默认端口 4310，仅监听回环地址。执行 `npm --prefix docs-site run build` 和 `typecheck`；页面体验还需在桌面、移动端检查导航、搜索与溢出。\n","modules/e-approvals.md":"---\ntitle: 审批与权限\ndescription: 将审批绑定到完整工具参数，在会话范围内执行人工、辅助或全自动审批，并记录审计结果。\nsources:\n  - app/api/e/approval-binding.ts 130196b90918 bindApproval exactOperationKey\n  - app/api/e/approval-engine.ts 5ae03852a7d4 ApprovalEngine\n  - app/api/e/approval-rules.ts de2e761cb335 approvalRule\n  - app/api/e/approval-reviewer.ts 070f63fa8c29 reviewApproval parseReview proposeApprovalGrant\n  - app/api/e/session-manager.ts f1a051ecac53 setApprovalMode grantExactApproval\n  - app/scripts/e-control.mjs ed63498cbe6f controlSession\ncovers:\n  - app/api/e/approval-binding.ts\n  - app/api/e/approval-engine.ts\n  - app/api/e/approval-rules.ts\n  - app/api/e/approval-reviewer.ts\n---\n\n# 审批与权限\n\n## 职责\n\n这一层决定待审批的工具操作是否留给人工、交独立模型审查，或按用户明确选择的会话模式批准。审批对象绑定原生会话、当前运行代次和完整工具参数；旧审查结果不能直接批准已经变化的请求。\n\n自动批准只提交授权决定，不代表工具已经执行成功。授权不跨会话恢复：停止、重启或切换审批模式都会清空当前自动审查任务和精确授权。实现分别位于审批绑定、审批引擎和会话管理文件。\n\n## 对外接口\n\n- `bindApproval` 在 `app/api/e/approval-binding.ts` 中把待审批记录和工具参数绑定，生成 `digest`。它同时比对工具记录与消息块中的名称、参数，只有完整一致的输入才标记为 `complete`。`exactOperationKey` 为工具名称与完整参数生成稳定摘要。\n- `ApprovalEngine` 在 `app/api/e/approval-engine.ts` 中提供 `set`、`reset`、`manual`、`grantExact` 和 `observe`。模式有 `manual`、`assisted`、`full`。\n- `approvalRule` 在 `app/api/e/approval-rules.ts` 中返回 `allow`、`review` 或 `manual`。精确命中的只读命令可直接通过，小范围文件改动交独立模型审查，其余留给人工。\n- `reviewApproval` 启动无工具的独立 Pi 审查进程。`parseReview` 用严格 schema 解析结果，只接受明确的低风险批准；并发最多 2 个，45 秒超时。\n- `proposeApprovalGrant` 只生成正则建议和风险说明，没有授权能力。当前 `grantExact` 使用工具与完整参数精确匹配，不能把建议正则当成已启用的规则。\n- 会话管理层通过 `setApprovalMode` 与 `grantExactApproval` 接入；最终决定仍由 `controlSession` 发送给核心运行时。\n\n## 数据怎么流\n\n会话快照变化后，审批引擎检查是否有待处理的审批，以及当前能力是否仍然有效。人工模式通常不自动动作；用户若已经授权当前会话内某个完全相同的操作，该操作可以再次匹配。辅助模式先过确定性规则，必要时再提交独立模型。全自动模式跳过这组风险筛选，但仍会检查会话和审批有没有变化。\n\n独立模型收到最近一条用户消息的文本、工作目录和拟执行工具参数。审查进程使用临时目录，不带会话文件，也不启用工具、扩展或技能。结果不确定、输出无效、超时或进程失败，都留下人工处理机会，不会自动重试。\n\n提交前会再次确认审批摘要与会话身份。辅助模式还会重新检查文件路径与目标状态；人工处理或模式切换会中止旧审查。授权意图经会话管理层发送到工作进程，再由核心审批接口处理。审计记录保留来源、理由和阶段，最近 100 条随会话记录保存。\n\nCanvas 的四个协作工具也经过 e 的同一审批通道。Canvas 在自己的 generation 目录生成适配器副本，仅增加工具名单；ADE 原文件不改。辅助规则把这些工具作为未知工具交给人工，Full Access 仍只在用户明确启用的当前会话内自动处理。服务端再校验真实工具、参数与批准证据，不凭来源声明执行；见 [Canvas 协作](collaboration.md)。\n\n## 改动指南\n\n- 修改绑定规则先看 `bindApproval`：`digest` 覆盖原生身份、运行代次、审批对象和参数，`complete` 还要求不同来源一致。不能只凭工具名或摘要文字批准。\n- `grantExact` 只接受完整、未变化的 `bash`、`write`、`edit` 请求，最多保存 100 项；授权键还包含工作目录与运行代次。不要将这些内存授权恢复自磁盘。\n- 新增规则需检查 `approvalRule` 的路径约束、字段白名单及内容筛选。路径检查拒绝 `..` 跳转与任意一层符号链接（包括悬空链接），并解析真实目标或新文件父目录。普通目录别名也会转人工；这是有意收紧的辅助审批边界。外部工具执行前的文件系统竞态仍不能仅靠预检消除。\n- `reviewApproval` 的结论不能覆盖确定性规则。改变审查提示或 schema 时，保留无工具模式、取消信号和无效输出转人工的行为。\n- 审计中的 `submitted` 只说明批准请求已提交。执行结果必须查看核心审批与工具状态，不能用审计条目替代运行结果。\n- 与消息发送共用的能力和意图幂等检查见[e 会话运行时](e-runtime.md)；线上的审批字段定义见[共享内容合同](message-content.md)。\n","modules/e-runtime.md":"---\ntitle: e 会话运行时\ndescription: 会话从持久化记录启动独立工作进程，经 e-core 与 Pi 执行，再把可核验快照送回画布。\nsources:\n  - app/api/e-adapter.ts e4029903d0d7 eSessions SessionManager\n  - app/api/e/config.ts f41967b22889 runtimeConfig runtimeStatus MAX_SESSIONS\n  - app/api/e/session-manager.ts f1a051ecac53 SessionManager eSessions\n  - app/api/e/message-queue.ts 035004c14654 mutateQueue reconcileQueue queueReady\n  - app/api/e/projection.ts b9672126cfbc projectSession\n  - app/scripts/e-runtime-worker.mts 597fd806824d control publish init\n  - app/scripts/e-configuration.mjs 6014fd127d51 readConfiguration assertIdle changeConfiguration\n  - app/scripts/e-control.mjs ed63498cbe6f controlSession\ncovers:\n  - app/api/e-adapter.ts\n  - app/api/e/config.ts\n  - app/api/e/session-manager.ts\n  - app/api/e/message-queue.ts\n  - app/api/e/projection.ts\n  - app/scripts/e-runtime-worker.mts\n  - app/scripts/e-configuration.mjs\n---\n\n# e 会话运行时\n\n## 职责\n\n这一层管理真实会话的创建、停止和恢复。每个运行中的会话都有独立工作进程；工作进程连接外部 ADE 检出目录里的 e-core，再启动 Pi。仓库负责进程编排、消息发送和状态投影，模型执行与核心事件归约由外部运行时承担。\n\n会话记录保存在本地。API 重启后会保留历史状态，但不会自动重启模型进程，也不会自动重发结果未知的消息。待发队列需要用户明确恢复，自动审批授权也会清空。实现依据是 `app/api/e/session-manager.ts` 的加载、持久化和启动路径。\n\n## 对外接口\n\n- `app/api/e-adapter.ts` 是兼容导出层，公开 `eSessions`、`SessionManager`、`runtimeStatus` 和 `projectSession`。\n- `SessionManager` 提供 `create`、`list`、`get`、`rename`、`stop`、`resume`、`control`、`queue`、`configuration` 与 `close`；状态变更通过 `changed` 事件发布完整 `SessionView` 副本。\n- `control` 接受 `messages`、`abort` 或 `approval`，使用 `intentId` 保存请求签名与结果。同一标识不能用于不同请求；超时记为结果未知，不自动重试。\n- `mutateQueue` 处理待发消息的增加、修改、删除、移动和暂停恢复。`reconcileQueue` 用运行时动作记录确认消费，`queueReady` 决定是否可以继续派发。\n- `runtimeConfig` 读取 `ADE_ROOT`、`PI_BIN` 和项目目录。`runtimeStatus` 检查外部模块接口、Pi 版本与模型目录，结果缓存 15 秒。并发会话默认上限为 4，可由 `CANVAS_MAX_SESSIONS` 调整至 1–8。\n- 工作进程只接收父进程 IPC。`init` 启动运行时，`control` 处理消息和控制请求，`publish` 发出快照；这不是供浏览器直接调用的公共服务。\n\n## 数据怎么流\n\n创建会话先分配原生会话标识并写下记录，再检查运行环境和并发额度。随后父进程启动工作进程，把项目目录、数据目录和模型选择交给它。工作进程建立本地连接，将有限权限通过继承的文件描述符交给核心进程和 Pi。只有两边确认同一个原生会话、消息发送能力已就绪，父进程才把会话标为可用。\n\n发送消息先在父进程校验正文和附件，再持久化发送意图。工作进程重新读取模型状态，普通下一轮消息还要确认运行器空闲；图片会额外检查是否能原样交给 Pi。控制适配层读取最新能力与版本后提交动作。核心事件经订阅桥汇成快照，父进程更新记录、发布状态，再尝试消费下一条待发消息。附件规则见[共享内容合同](message-content.md)，审批分支见[审批与权限](e-approvals.md)。\n\n待发消息从暂停状态开始，明确授权后才会自动发送。HTTP 或 IPC 返回成功不等于模型已经收到消息；队列还会等待核心动作变成已应用。重启前处于派发或已提交状态的消息会改为结果未知，队列冻结，避免重复发送。\n\n切换配置前，父进程检查版本和正在进行的操作；工作进程再次检查空闲状态。模型切换走核心授权接口，思考级别走受限的 Pi 配置通道，最后回读实际配置。会话投影只提供画布兼容颜色与摘要，不能据此推断某一轮执行成功。\n\n协作工具通过额外的私有文件描述符与父进程 IPC 接入，调用来源绑定当前 worker，并等待 e 中已批准、参数一致的运行中工具证据。消息仍进入现有队列，不额外实现运行器。API、worker、扩展通过版本化 manifest 与私有握手确认包、Skill 发现、四工具及系统指令绑定；旧 API 或版本不兼容只停用协作，普通聊天继续。服务重载后需要显式恢复会话才加载新工具；不会热注入已有 Pi 进程。详见 [Canvas 协作](collaboration.md)。\n\n## 改动指南\n\n- 先读 `app/api/e/session-manager.ts` 的 `launch`、`changed`、`control` 和 `dispatchQueue`，再看 `app/scripts/e-runtime-worker.mts`。不要把本地请求成功改写成已消费；消费判定在 `reconcileQueue`。\n- 默认数据位置是 `app/api/data/e/\u003cnodeId>/`，可由 `CANVAS_DATA_DIR` 改写根目录。`record.json` 采用临时文件加重命名；工作进程另存 Pi 会话、控制日志和每次启动的核心状态。恢复时必须找到原始 Pi 会话文件，找不到会拒绝启动。\n- `app/scripts/e-control.mjs` 的 `controlSession` 会检查能力是否权威且未过期，并在 `STALE_STATE` 时重新取一次控制依据。新增控制操作必须同时检查父进程、IPC 白名单和核心授权，不能增加任意 RPC 透传。\n- 配置与发送的互斥由父进程操作集合和工作进程串行锁共同实现。修改 `changeConfiguration` 时保留原生会话身份检查、空闲检查与最终回读。\n- `projectSession` 保留已有坐标和分区，只截取最新助手文本的末尾 600 字作为摘要。会话生命周期、运行状态和画布颜色是不同字段。\n- 新增与编辑均先暂存改动，再检查最终序列化队列的 UTF-8 字节数不超过 32 MiB；新增另限 20 条 pending。拒绝不会改变原队列、版本或授权；仍在派发的条目保留对象身份，避免丢失异步状态回写。\n","modules/frontend-shell.md":"---\ntitle: 浏览器入口与工作区\ndescription: 页面路由、工作区首页、主题和前端构建配置。\nsources:\n  - app/src/main.tsx be1df370b3d8 createRoot BrowserRouter\n  - app/src/App.tsx 10682b846ed7 App\n  - app/src/pages/home/index.tsx 4ca46119c6b9 HomePage WorkspaceCard\n  - app/src/pages/home/CreateSessionForm.tsx 5a3183cc3eb9 CreateSessionForm\n  - app/src/theme/ThemeProvider.tsx ebbfcb273a1c ThemeProvider\n  - app/src/index.css 41d59ac8e5b6\n  - app/vite.config.ts cf1d2d5a5f57 apiPort\n  - app/src/lib/utils.ts bd0c391ddd10 cn\n  - app/src/hooks/use-mobile.ts 2b0fe1dfef3b useIsMobile\ncovers:\n  - app/src/App.tsx\n  - app/src/main.tsx\n  - app/src/index.css\n  - app/src/pages/home/\n  - app/src/theme/\n  - app/src/lib/\n  - app/src/hooks/\n  - app/index.html\n  - app/vite.config.ts\n  - app/tsconfig.app.json\n  - app/tsconfig.node.json\n  - app/tailwind.config.js\n  - app/postcss.config.js\n  - app/components.json\n---\n\n## 职责\n\n提供浏览器应用的入口和工作区首页。用户在首页查看真实会话、示例或已归档工作区，也可以创建工作区并启动一个 e 会话，再进入画布。主题、通用样式与开发代理在这一层统一配置。\n\n## 对外接口\n\n`app/src/main.tsx` 在根元素挂载 `ThemeProvider` 和 `BrowserRouter`，`app/src/App.tsx` 注册以下路由：\n\n| 路径 | 组件 | 行为 |\n| --- | --- | --- |\n| `/` | `HomePage` | 工作区列表与创建会话表单。 |\n| `/welcome` | `PocLanding` | 原型对比落地页。 |\n| `/react-flow` | `ReactFlowPage` | React Flow 本地演示。 |\n| `/tldraw` | `TldrawPage` | tldraw 本地演示。 |\n| `/canvas` | `CanvasRedirect` | 定位活跃工作区。 |\n| `/canvas/:workspaceId` | `CanvasPage` | 指定工作区实时画布。 |\n\n`HomePage` 位于 `app/src/pages/home/index.tsx`，列表读取复用 `live-store.ts` 的 `fetchWorkspaces`。`CreateSessionForm` 位于同目录，调用运行环境探测、工作区创建和会话创建端点。\n\n`ThemeProvider`（`app/src/theme/ThemeProvider.tsx`）使用 `next-themes`，通过根元素 class 切换主题，存储键是 `agent-canvas-theme`，默认跟随系统。`cn`（`app/src/lib/utils.ts`）合并类名，`useIsMobile`（`app/src/hooks/use-mobile.ts`）以 768px 为断点供基础组件使用。\n\n`App` 在全局配色容器内提供卡片视图入口的挂载槽；仅主画布页面挂入该入口，其他页面保持原来的配色控制。入口与配色一起在浮层/全屏期间可访问，不进入聊天消息内容或运行器配置。\n\n## 数据怎么流\n\n首页先读取工作区列表，按后端类型、来源和项目路径分组，组内按最近活跃时间排序。卡片显示轻量图预览，点击后在新标签页打开对应画布。地址中的视图参数决定读取普通列表、归档列表还是示例列表。\n\n新建表单先探测本机运行环境及可用模型。用户提交后，先创建工作区，再在其中创建 e 会话，两次请求成功才跳转。第二步失败时保留已创建工作区标识，提供打开失败会话的入口；它不是一个原子事务。\n\n重命名和归档在首页直接提交工作区更新请求，成功后刷新列表。归档前明确提示会停止该工作区的 Agent 并保留历史。列表加载失败会展示错误，只有明确的演示参数允许本地示例回退。\n\n开发环境下，浏览器仍请求同源 API 和 WebSocket，Vite 把它们转发到本机后端。默认前端端口为 5173，后端代理端口为 3000，可分别通过环境变量覆盖。应用资源从根路径加载，避免深层画布地址刷新时错找静态资源。\n\n## 改动指南\n\n- 路由事实以 `App.tsx` 为准，部分历史组件注释仍把原型落地页写成首页。文档网站的 Landing Page 不应覆盖运行应用的工作区首页。\n- 首页读取在 `home/index.tsx`，创建事务在 `CreateSessionForm.tsx`。调整创建流程时保留部分成功后的恢复入口，不能只给出泛化错误。\n- 前后端开发代理见 `app/vite.config.ts`，变量为 `CANVAS_UI_PORT` 和 `API_PORT`。不要在页面中硬编码另一端口，否则会绕过同源代理。\n- 全局颜色与尺寸令牌在 `app/src/index.css`，Tailwind 映射在 `app/tailwind.config.js`。主题改变还会影响共享组件、终端和 tldraw，需分别检查。\n- 基础组件与共享显示层分别见[UI 基础组件](ui-primitives.md)和[画布原型与共享呈现](prototypes.md)。\n","modules/herdr.md":"---\ntitle: 旧版终端编排\ndescription: herdr 兼容后端的依赖调度、标记协议和终端快照。\nsources:\n  - app/api/shell.ts 1c56b4a897b0\n  - app/api/coordinator.ts 2f2630aa80fe coordinator\n  - app/api/herdr-adapter.ts 49bde9f8697c call ensureServer subscribeEvents paneRead\n  - app/api/pump.ts 576243a1e843 pump wirePumpToGraph\n  - app/api/eventbus.ts 47b4e6ed936c eventbus\ncovers:\n  - app/api/coordinator.ts\n  - app/api/herdr-adapter.ts\n  - app/api/pump.ts\n  - app/api/eventbus.ts\n  - app/api/shell.ts\n---\n\n# 旧版终端编排\n\n## 职责\n\n这个兼容后端把一张图映射到本机终端工作区，把分区映射为标签页，把普通节点映射为终端窗格。调度器等待强依赖完成后启动节点，读取命令写出的进度和退出标记，推进图中的成功、失败及跳过状态。\n\n终端画面按需轮询，只有订阅中的节点持续读取。这里执行的是 shell 命令和演示脚本，不是当前真实 Agent 会话的消息与审批系统。\n\n## 对外接口\n\n- `app/api/coordinator.ts` 导出 `coordinator`。`run`、`reset`、`sendInput`、`approve` 分别负责运行、清场、输入和旧版审批；由[本地控制面](control-plane.md)调用。\n- `app/api/herdr-adapter.ts` 的 `call` 每次建立一个 Unix socket 连接，交换一行 NDJSON 请求和响应。`ensureServer` 先探活，再尝试启动本地二进制；`HERDR_BIN` 与 `HERDR_SOCKET_PATH` 可覆盖自动发现结果。\n- 同文件的 `subscribeEvents` 保持长连接，断开后等待一秒重连。调用方使用归一化后的点分事件名；普通终端输出不经过事件订阅，而由 `paneRead` 读取。\n- `app/api/pump.ts` 的 `pump` 按工作区和节点维护订阅，500 毫秒轮询一次可见 ANSI 内容。`wirePumpToGraph` 在节点进入终态后触发末次读取并停止定时器。\n- `app/api/eventbus.ts` 的 `eventbus` 保留内存事件，尽力追加到 `CANVAS_EVENTS_LOG`，默认 `/tmp/canvas-events.jsonl`。事件形状是 `{ id, ts, workspaceId, nodeId?, kind, text }`，工作区字段由生产者显式传入，也不在重启时重放文件。\n\n## 数据怎么流\n\n运行请求先建立本地工作区和分区标签页，调度器再寻找依赖已满足的待运行节点。节点启动后，服务报告代理状态，并把包装后的命令送进终端。显式命令优先；没有显式命令时尝试演示脚本，最后退回交互式 shell。协调节点自身不占终端。\n\n包装命令把真实退出码写进运行目录。演示脚本还可写出审批、进度和消息文件。服务每 400 毫秒检查这些文件：审批进入等待状态，进度更新节点，退出码决定成功或失败。失败节点可激活错误处理分支，强依赖失败则向下游传播跳过状态。消息速率每五秒刷新到弱边标签。\n\n浏览器订阅终端后，服务从本地窗格取完整画面；内容改变才向订阅者推送。图状态变化和事件走控制面的广播线路，图完成时保存工作区记录。重置会停止定时器和终端轮询，关闭对应本地窗格及工作区，删除该次运行标记，再恢复初始图。\n\n## 改动指南\n\n调度规则集中在 `app/api/coordinator.ts` 的 `schedule`、`startNode`、`finishNode`、`activateErrorRoutes`、`checkDone`。`ctx.starting` 在异步启动前同步占位，避免多个节点同时结束时重复启动下游；不要把占位挪到异步调用之后。\n\n现有 `n-chat` 等演示节点仍有特殊规则，通用图不应继续扩展这些硬编码。运行目录默认为 `/tmp/canvas-run/\u003cworkspaceId>`，可以通过 `CANVAS_RUN_DIR` 改根路径。`app/api/shell.ts` 的 `shellQuote` 和 `exitWrapper` 统一引用路径与节点参数；命令正文仍写入脚本文件，避免双重解释。\n\n`pane.exited` 本身没有退出码，必须优先读 `.exit`。无退出标记的异常关闭同样激活 `activateErrorRoutes`，然后继续调度与完成检查。`handlePaneEvent` 单独处理归一化生命周期事件，可在不启动 herdr 的测试中验证。\n\n`eventbus.forNode` 与 `ratePerMinute` 都要求工作区标识；图状态变化与调度器的生产点同步记录归属。不能再通过节点名猜测事件属于哪个工作区。\n","modules/message-content.md":"---\ntitle: 共享内容合同\ndescription: 浏览器、API 和工作进程共用消息校验，保持附件内容、模型能力与会话线协议一致。\nsources:\n  - app/api/e/contracts.ts 79c78ef00a84 SessionView SessionSnapshot Attachment capabilityAvailable\n  - app/api/e/attachments.ts 91fc1060693b\n  - app/shared/message-content.mjs e247686807e8 ATTACHMENT_LIMITS validateMessage messageBlocks\n  - app/shared/message-content.d.mts 8077661a5895 validateMessage messageBlocks\n  - app/scripts/e-message-preflight.mjs 74c4cb0f8959 loadPiImageProcessor assertImagesUnchanged\n  - app/scripts/e-runtime-worker.mts 597fd806824d control\ncovers:\n  - app/api/e/contracts.ts\n  - app/api/e/attachments.ts\n  - app/shared/\n  - app/scripts/e-message-preflight.mjs\n---\n\n# 共享内容合同\n\n## 职责\n\n这一层统一会话线协议与消息内容校验。浏览器和服务端使用同一份平台无关实现，避免一端接受的正文或附件到了另一端被悄悄改写。服务端兼容文件只转导出共享实现，不维护第二套规则。\n\n附件仅限纯文本和指定图片格式。校验会拒绝无效编码、空附件和超限内容；发送前还会检查当前 Pi 能否原样接收图片。图片如果需要隐式缩放或转换，系统会阻止发送，让用户先处理图片。\n\n## 对外接口\n\n- `app/api/e/contracts.ts` 定义 `SessionView`、`SessionSnapshot`、`ControlPayload`、`RuntimeConfiguration`、`MessageQueue`、`Attachment` 和 `MessageOrigin` 等线协议类型，供浏览器安全地做类型导入。\n- `capabilityAvailable` 要求会话处于 `ready`，能力可用、来源权威，且尚未过期。它检查单个能力，不代替服务端的业务约束。\n- `app/shared/message-content.mjs` 导出 `decodeAttachment`、`attachmentText`、`validateMessage`、`messageBlocks` 和 `ATTACHMENT_LIMITS`；对应声明位于 `message-content.d.mts`。`app/api/e/attachments.ts` 转导出这些函数。\n- `validateMessage` 返回原正文和附件的深拷贝，不会顺手清洗或压缩附件。`messageBlocks` 返回纯字符串，或一个文本块加若干图片块。\n- `loadPiImageProcessor` 从当前 Pi 可执行文件向上查找兼容安装，加载图片处理器；`assertImagesUnchanged` 比较处理前后的编码、MIME 与处理提示。\n\n## 数据怎么流\n\n正文与附件到达校验器后，先检查正文类型、字符长度和孤立代理项，再检查附件数量与请求编码体积。附件逐个校验标识、名称、格式和内容签名；纯文本按严格 UTF-8 解码，不允许无效字节或二进制空字符。图片还要确认模型支持图像输入。\n\n消息发往运行时前，纯文本附件会按名称加上说明，与正文合并成一个规范文本。图片保留原编码作为独立内容块。这样发送内容与 Pi 之后公开观察到的用户消息一致，核心运行时才能核对消息确实被消费。\n\n工作进程会重新读取当前模型，而不是只相信页面缓存的选择。遇到图片时，它调用当前 Pi 安装的图片处理器验证：图片必须能解码，而且结果不能发生转换、缩放或附加处理提示。处理器不可用也会拒绝发送。后续派发与确认流程见[e 会话运行时](e-runtime.md)。\n\n## 协作公共契约\n\n`app/shared/collaboration-protocol.mjs` / `.d.mts` 定义协作工具、参数与结果 schema、稳定错误码、版本与预算，以及完整握手就绪判断，供 API、扩展和状态展示共用。Node-only 的 `collaboration-package.mjs` 负责读取独立 Skill 并计算 manifest，不导入浏览器。调用方身份与审批证据仍在服务端核验；schema 通过不代表有权限。详见 [Canvas 协作](collaboration.md)。\n\n## 改动指南\n\n- 限制统一位于 `ATTACHMENT_LIMITS`：每条最多 4 个附件，单张图片 2 MiB，文本附件合计 100 KiB，请求最多 12 MiB。正文另限 100000 个 JavaScript 字符单位；不要把它解释成 UTF-8 字节数。\n- `Attachment` 只允许 `text/plain`、`image/png`、`image/jpeg`、`image/webp`。图片签名校验只是初筛，完整解码验证发生在工作进程，不应删除后者。\n- `messageBlocks` 的文本合并顺序参与实际消费核验。修改附件标题、换行或块顺序时，需要连同运行时消费证据的测试一起检查。\n- `.mjs` 实现与 `.d.mts` 声明要同步维护；浏览器导入共享路径，避免落入服务端 `/api` 路由命名空间。\n- `MessageOrigin` 区分来源类别、通道和认证状态。当前工作进程只在找到动作应用证据与消息来源事件的对应关系后标记 Canvas 本地输入，并保留 `authenticated: false`；不要仅凭消息角色推断已认证人类身份。\n- `MessageOrigin` 的受管 Agent 来源还带 sourceNodeId、sourceNativeSessionId 与 communicationId，来自私有工具调用和实际消费观察的关联；重放只恢复先前可信记录的精确唯一元组，不解析正文认人，见 [Canvas 协作](collaboration.md)。\n- `app/shared/agent-reference.mjs` 与 `.d.mts` 提供前后端一致的身份/hash 引用；昵称只描述，解析按同画布 hash，歧义拒绝。\n- 审批摘要与权限判断使用同一组会话字段，修改 `SessionSnapshot` 时同时检查[审批与权限](e-approvals.md)和运行时投影。\n","modules/prototypes.md":"---\ntitle: 画布原型与共享呈现\ndescription: 两套本地演示及产品画布复用的显示组件。\nsources:\n  - app/src/shared/card-view-preferences.ts 786286221b1b GlobalCardViewPreferences GLOBAL_CARD_VIEW_KEY\n  - app/src/shared/NodeShell.tsx 27c6bff70573 NodeShell compactHeader headerActions\n  - app/src/pages/reactflow/index.tsx ff659ad06608 ReactFlowPage EventEngine\n  - app/src/pages/tldraw/TldrawPage.tsx 82667d254c67 TldrawPage EventEngine\n  - app/src/shared/mock/engine.ts b0b754204342 EventEngine buildSnapshot\n  - app/src/shared/ViewModeManager.ts 7298339d7c1d ViewModeManager modeForScreenWidth\n  - app/src/shared/FocusOverlay.tsx a60114c77b42 FocusOverlay\n  - app/src/pages/canvas/collaboration-demo/model.ts c941724956b2 demoReducer outputAt\n  - app/src/pages/PocLanding.tsx 11a61d8c9b07 Home\ncovers:\n  - app/src/pages/reactflow/\n  - app/src/pages/tldraw/\n  - app/src/pages/PocLanding.tsx\n  - app/src/pages/canvas/collaboration-demo/\n  - app/src/shared/\n---\n\n## 职责\n\n用同一组预设事件比较两种画布实现，同时为产品画布提供卡片、专注窗口和显示档位管理。演示页面只回放本地数据，不启动真实 Agent；共享显示组件仍被真实画布使用，不能把整个目录视为可删除的演示代码。\n\n这一范围超过 20 个文件，职责可概括为“让同一份节点状态适配不同画布并保持一致呈现”。本地事件引擎与两套适配器放在一起，便于比较；真实传输和会话动作另见[实时画布](canvas.md)。\n\n## 对外接口\n\n- `ReactFlowPage`（`app/src/pages/reactflow/index.tsx`）与 `TldrawPage`（`app/src/pages/tldraw/TldrawPage.tsx`）分别承接 `/react-flow`、`/tldraw`，共享本地 `EventEngine`。\n- `EventEngine`、`buildSnapshot`（`app/src/shared/mock/engine.ts`）提供播放、暂停、跳转、重置和 1/2/4 倍速；快照由预设节点、边与指定下标之前的事件折叠而成。\n- `ViewModeManager`、`modeForScreenWidth`（`app/src/shared/ViewModeManager.ts`）管理 L0/L1/L1s 显示档位、用户显式进入的 L2 专注，以及动画开关。按节点屏幕宽度划档，阈值是 240px、640px，缩放停止 120ms 后重算。\n- `FocusOverlay`（`app/src/shared/FocusOverlay.tsx`）把同一个内容容器移到浮窗或视口窗口，使用稳定 portal 容器保留子组件状态。\n- `Home`（`app/src/pages/PocLanding.tsx`，路由侧以 `PocLanding` 名称导入）提供原型入口。旧画布占位页已在本次体检修复中删除；实际原型路由仍保留。\n- `demoReducer`、`outputAt`（`app/src/pages/canvas/collaboration-demo/model.ts`）描述独立的预设协作剧本；目前未接入浏览器页面，不能写成已上线协作入口。\n\n## 数据怎么流\n\n进入原型页后，各页面创建自己的本地事件引擎和显示管理器。播放时引擎推进事件下标，页面订阅变化，再从事件序列重建节点状态。跳转时间点走同一条重建路径，不需要访问后端或恢复真实进程。\n\nReact Flow 页面把快照映射为自定义节点与边；tldraw 页面创建自定义节点形状，再用覆盖层绘制边。两者上报缩放和节点宽度，让共享显示管理器决定摘要、默认或放大视图。专注由用户显式触发，不随缩放自动进入。\n\n真实画布也使用共享的节点外壳、专注窗口与显示档位管理，但状态来自后端。主画布提供工作区命名空间时，显示优先级为专注窗口、单卡覆盖、全局默认；自动模式最后按屏幕宽度决定档位。全局默认保存于本浏览器同源存储，跨标签页同步；单卡覆盖按工作区存储并同步。旧版固定缩略/详细设置在读取时保留，新版区分跟随全局与显式自动；迁移不删除旧记录。无命名空间的原型管理器不继承产品的全局值，演示回放本身不落服务端存储。动画设置默认跟随系统减少动态效果的偏好，也允许用户覆盖。\n\n`GlobalCardViewPreferences` 使用 `canvas.card-view.global.v1` 保存全局 auto/compact/detail，存储不可用时保留内存行为。`ViewModeManager` 使用 `canvas.card-views.v2:\u003cworkspaceId>` 保存单卡覆盖；不存在 v2 才回读 v1 的 compact/detail。清除覆盖写入空 v2 对象，防止旧 v1 固定项再次出现。全局及单卡 storage 事件只更新显示，监听随订阅/释放管理，不发送任何会话控制请求。\n\n## 改动指南\n\n- 改演示剧情看 `shared/mock/events.ts` 与 `buildSnapshot`；改真实会话不要往预设事件表添加伪造结果。\n- 改显示阈值或卡片偏好看 `ViewModeManager.ts`。产品画布和两套原型共用它，测试要覆盖三个入口。\n- `NodeShell` 和 `FocusOverlay` 通过可选 `compactHeader` / `headerActions` 接纳真实聊天的紧凑标题栏；默认值保留原型与 herdr 的身份行及原有标题布局。\n- `FocusOverlay` 的内容容器身份必须稳定。切换浮窗、铺满和返回画布应移动现有容器，而不是重建输入框、终端或阅读位置。\n- 原型界面的审批覆盖只影响本地快照，不等同于后端审批。新增真实审批仍走会话交互模块。\n- 旧画布占位页已删除；`collaboration-demo/model.ts` 仍是未接入的预设剧本。不要按目录名批量删除 `shared/`。\n","modules/research.md":"---\ntitle: 研究与历史实验\ndescription: 设计依据、协议实证和旧验收工具的阅读边界。\nsources:\n  - tools/legacy/spike/REPORT.md f75c37d5e7bd\n  - tools/legacy/spike/herdr_client.py 08676f7951c4 Herdr\n  - tools/legacy/spike/events_subscribe.py 4c1cd70eb79a\n  - tools/legacy/render-preview/accept-run.py 5c5a78439092\n  - tools/legacy/render-preview/ws-term-test.mjs 8d0caaf52495\n  - docs/research/analysis/agent_canvas_cross_verification.md 7ba406fc20e6\n  - docs/plans/plan_poc.md b49a4a4b2ca0\n  - docs/plans/plan_product.md 49c20fee682c\n  - docs/research/report/agent_canvas.agent.final.md 77c747ba261a\ncovers:\n  - tools/legacy/\n  - docs/research/analysis/\n  - docs/plans/plan.md\n  - docs/plans/plan_poc.md\n  - docs/plans/plan_product.md\n  - docs/plans/canvas-optimization.md\n  - docs/research/report/agent_canvas.agent.final.converted.md\n  - docs/research/report/agent_canvas.agent.final.md\n  - docs/research/report/agent_canvas.agent.outline.md\n  - docs/research/report/agent_canvas.citation.jsonl\n  - docs/research/report/agent_canvas_ref.md\n  - docs/research/report/agent_canvas_sec00.md\n  - docs/research/report/agent_canvas_sec00_refs.md\n  - docs/research/report/agent_canvas_sec01.md\n  - docs/research/report/agent_canvas_sec01_refs.md\n  - docs/research/report/agent_canvas_sec02.md\n  - docs/research/report/agent_canvas_sec02_refs.md\n  - docs/research/report/agent_canvas_sec03.md\n  - docs/research/report/agent_canvas_sec03_refs.md\n  - docs/research/report/agent_canvas_sec04.md\n  - docs/research/report/agent_canvas_sec04_refs.md\n  - docs/research/report/agent_canvas_sec05.md\n  - docs/research/report/agent_canvas_sec05_refs.md\n  - docs/research/report/agent_canvas_sec06.md\n  - docs/research/report/agent_canvas_sec06_refs.md\n  - docs/research/report/agent_canvas_sec07.md\n  - docs/research/report/agent_canvas_sec07_refs.md\n  - docs/research/report/agent_canvas_sec08.md\n  - docs/research/report/agent_canvas_sec08_refs.md\n---\n\n# 研究与历史实验\n\n## 职责\n\n这里保存项目为什么选择当前交互和后端路径的历史依据，包括早期调研、协议实验及旧版验收脚本。文件数量较多，但共同职责明确：保留决策来源，不参与生产服务的模块装配。\n\n阅读时应区分研究建议、当时实测结论和当前实现。早期计划中的能力不能直接视为已经交付，历史测试通过也不代表现在的工作区已经验证过。\n\n## 对外接口\n\n- `docs/research/analysis/agent_canvas_cross_verification.md` 汇总 12 个研究维度，标明验证日期为 2026-09-22。`docs/research/report/agent_canvas.agent.final.md` 是综合报告；分章节草稿、引用与转换版保留写作过程，不由应用构建读取。\n- `docs/plans/plan_poc.md` 记录 React Flow 与 tldraw 双实现的早期计划，`docs/plans/plan_product.md` 记录接入 herdr 的产品化路径。这些是历史设计材料，不是现行 API 合同。\n- `tools/legacy/spike/REPORT.md` 记录 herdr 0.9.1 的实测边界，包括一次请求一个连接、事件订阅长连接、终端输出轮询以及退出事件没有退出码。`tools/legacy/spike/herdr-api.schema.json` 和 `tools/legacy/spike/events-sample.jsonl` 是当时的协议与事件样本。\n- `tools/legacy/spike/herdr_client.py` 提供早期 `Herdr` 客户端，`tools/legacy/spike/events_subscribe.py` 订阅事件并写 NDJSON。它们含实验机器的硬编码路径，不是运行时适配器的替代品。\n- `tools/legacy/render-preview/accept-run.py`、`poll-run.py`、`parity-test.py`、`ws-term-test.mjs` 是旧版服务验收入口；`herdr-structure.py` 读取本地工作区结构。目录名不能当成无副作用保证：其中脚本会运行图、发送终端输入、自动批准或重置工作区。\n\n## 数据怎么流\n\n研究材料先按维度收集参考，再交叉验证，最终汇入综合报告和产品计划。这条链路用于追溯设计，不进入在线请求处理。\n\n协议实验直接连接本地终端服务，把请求和事件记录为样本。旧验收脚本则向既有 API 发送请求，轮询节点状态或订阅终端快照，再打印结果。它们依赖已经启动的外部服务；脚本本身不会提供一个隔离的测试后端。\n\n## 改动指南\n\n协议差异先比较 `tools/legacy/spike/REPORT.md` 与当前 `app/api/herdr-adapter.ts`，以当前实现及本次实测为准。不要照搬实验脚本中的 `/home/kimi`、`/root` 或 `/mnt/agents` 路径。\n\n运行 `tools/legacy/render-preview/accept-run.py` 前先读自动审批逻辑，确认目标工作区和副作用。`tools/legacy/render-preview/ws-term-test.mjs` 会运行并重置固定示例工作区；它不能在用户正在运行的工作区上随手执行。\n\n研究报告中的竞品判断和数字属于历史调研，不在本轮架构 Review 中重新背书。修改现行行为时更新代码事实页；历史材料保留日期和语境，避免把计划改写成实现。日常开发与分层验证入口见[启动与验证](development.md)。\n","modules/ui-primitives.md":"---\ntitle: UI 基础组件\ndescription: 区分产品在用的基础交互与受保护的未提交控件。\nsources:\n  - app/src/components/ui/button.tsx bee89f17a67d Button\n  - app/src/components/ui/button-variants.ts b2018207499f buttonVariants\n  - app/src/components/ui/switch.tsx 6a2b5241d8c0 Switch\n  - app/src/components/ui/form.tsx b52dfacdeae5 Form FormField\n  - app/src/components/ui/sidebar.tsx 86c5b01b9891 SidebarProvider Sidebar\n  - app/src/components/ui/sonner.tsx 7c5672d5f3fd Toaster\n  - app/src/components/ui/README.md 5578ebc47e52\n  - app/components.json 411f77047b2c\ncovers:\n  - app/src/components/ui/\n---\n\n# UI 基础组件\n\n## 职责\n\n提供不含会话业务的基础交互。产品当前使用按钮、开关与通知，其余保留控件尚未接入。\n保留未接入控件不是能力承诺，而是保护原有未提交修改及其依赖。\n\n本轮清理了 34 个无未提交改动、无产品入口、也不被保留代码依赖的文件。\n目录中仍有超过 20 个文件，是因为侧栏、表单及样式变体的未完成工作没有被删除或强行接入。\n\n## 对外接口\n\n| 接口 | 定义位置 | 当前使用 |\n| --- | --- | --- |\n| `Button`、`buttonVariants` | `button.tsx`、`button-variants.ts` | 工作区首页、原型入口、共享聊天与旧版审批 |\n| `Switch` | `switch.tsx` | 共享连线图例 |\n| `Toaster` | `sonner.tsx` | 产品画布、React Flow 与 tldraw 原型 |\n| `Form`、`FormField` | `form.tsx`、`form-context.ts` | 尚未接入；保留字段上下文拆分 |\n| `SidebarProvider`、`Sidebar` | `sidebar.tsx`、`sidebar-context.ts` | 尚未接入；保留上下文拆分与确定性占位宽度 |\n\n以上文件位于 `app/src/components/ui/`。职责索引在同目录 `README.md`。\n`app/components.json` 只是组件生成配置，不会把整个目录注册为运行入口。\n\n## 数据怎么流\n\n产品页面把状态与事件回调传给按钮和开关，再由页面处理业务请求。通知容器读取主题并设置通知颜色，不参与会话管理或网络请求。\n\n保留的表单和侧栏内部仍有相互依赖，但没有产品调用路径。保留干净的标签、输入、分隔线、抽屉、占位、提示和移动端判断，是为了不让未提交组件出现断链，不是为它们新增使用场景。\n\n## 改动指南\n\n- 基础控件不得依赖工作区 store 或会话合同；业务条件由上层传入。\n- 按钮样式仍集中在 `button-variants.ts`，不要恢复重复导出以绕过现有拆分。\n- 不要按 Knip 文件名单直接删除保留依赖。先检查所有未提交根节点，再求传递依赖闭包。\n- 需要使用未接入的表单或侧栏时，补实际消费入口和针对性测试；不要单靠测试 import 降低未使用计数。\n- 不批量生成无需求的控件，也不靠新增 ignore 或移动到扫描范围外隐藏候选。\n- 完整的 59 项证据与保护原因见[未使用文件复核](../unused-files.md)，实时结果见[体检报告](../health.md)。样式约束见[浏览器入口](frontend-shell.md)。\n","repository-layout.md":"---\ntitle: 目录约定\ndescription: 产品、测试、文档与历史工具的放置规则和迁移对照。\nsources:\n  - app/package.json 76486a23e156\n  - app/knip.jsonc 5f091132ff40\n  - app/src/pages/canvas/contracts.ts 75be9b49a4d0\n  - tools/legacy/README.md 7a5e19d96d98\n---\n\n# 目录约定\n\n根目录只保留项目说明和四个职责目录；没有改动产品或文档站的启动位置。\n\n```text\napp/                      产品：Vite 前端 + Hono API\n  api/                    控制面与 e / herdr 运行时\n  src/                    页面、共享视图和 UI 基础组件\n  shared/                 浏览器与服务端共用的内容校验\n  scripts/                启动器、IPC worker、演示脚本\n  test/\n    unit/                 隔离的 Node 单元与路由测试\n    browser/              Playwright fixture 和显式启用的真实测试\n    manual/               手工连接服务的探针，不进 npm test\ndocs-site/                Fumadocs 网站代码；content/docs 为派生内容\ndocs/\n  architecture/wiki/      当前架构的 Markdown 事实源\n  guides/                 启动、运维与验收指南\n  plans/                  历史计划和优化设计\n  research/analysis/      分维度调研\n  research/report/        综合报告、章节与引用\ntools/legacy/             原 spike、render-preview 历史脚本\n```\n\n## 迁移对照\n\n| 原位置 | 新位置 |\n| --- | --- |\n| 根目录 `agent_canvas*` | `docs/research/report/`，保留原文件名 |\n| `research/` | `docs/research/analysis/` |\n| 根目录 `plan*.md`、`canvas-optimization.md` | `docs/plans/` |\n| 根目录 `E_BACKEND.md`、`E_INTEGRATION_VERIFICATION.md`、`RUNBOOK_WSL.md` | `docs/guides/` |\n| `spike/`、`render-preview/` | `tools/legacy/` 下的同名目录 |\n| `app/api/test/` | `app/test/unit/`，同时修改导入与 npm 测试入口 |\n| `app/api/test-ws.mjs` | `app/test/manual/ws-smoke.mjs` |\n\n研究正文和实验脚本没有借搬迁改写历史结论。旧脚本保留当时的硬编码地址，\n可能运行、重置或自动批准工作区；它们不是安全的默认验收入口。\n\n## 新文件放哪里\n\n- 产品代码仍按当前职责归到 `api/`、`src/`、`shared/`。这轮没有为了统一目录外观而改动编译输出、运行数据或本机配置路径。\n- 前端画布消息与数据类型放在 `app/src/pages/canvas/contracts.ts`。真实 store 和 mock 都依赖合同，mock 不再反向依赖 store。旧类型导入由 store 转导出兼容。\n- 单元测试统一放 `app/test/unit/`，不能再塞进 `api/`；需要真实服务或真实模型的检查不加入默认 `npm test`。\n- `app/knip.jsonc` 明确声明动态 worker、测试与手工入口，并说明声明文件豁免。未使用组件仍在体检报告中，不靠把整个 UI 目录标成入口来掩盖问题。\n- `docs-site/content/docs/` 和架构 HTML 都从 Wiki 生成。更新正文后按[维护流程](maintenance.md)复核、同步与再生。\n\n## 这轮没有做什么\n\n上一轮删除了无引用的旧画布占位页；本轮又复核剩余 59 个候选，删除 34 个没有未提交改动的 UI 文件。\n另有 18 个未提交文件及 7 个依赖原样保留，不搬动、不改 import，也不以归档隐藏。\n具体职责和每个文件的结论见[未使用文件复核](unused-files.md)。这次减少源码维护面，不声称减少了产品运行时体积。\n大文件仍可按职责继续拆分；先补回归用例，再重构调度器和路由，避免一次混入多种风险。\n","review.md":"---\ntitle: 代码审查\ndescription: 当前工作区的高置信问题、触发条件和修复顺序。\nsources:\n  - app/test/unit/health-regressions.test.mjs 4ce16fe1aaa5\n  - app/test/unit/live-store-reconnect.test.mjs ec879ce1f0e9\n  - app/test/unit/coordinator-failure.test.mjs 7e6aeeacbf12\n  - app/test/unit/e-routes.test.mjs a1d8431a9269\n  - app/test/browser/e-canvas.spec.ts 6dbdbfa1d93d\n  - app/api/e/approval-rules.ts de2e761cb335 approvalRule\n  - app/api/e/message-queue.ts 035004c14654 mutateQueue\n  - app/src/pages/canvas/live-store.ts 056a5d79638a LiveStore\n  - app/src/pages/canvas/LiveTerminal.tsx c93871702251 LiveTerminal\n  - app/src/pages/canvas/index.tsx 0c93d9ab6b59\n  - app/src/pages/canvas/chat/attachments.ts 2eba1c6a1bc5 readAttachment\n  - app/api/routes.ts 7cbd733eaf33 wsHandlers\n  - app/api/eventbus.ts 47b4e6ed936c\n  - app/api/coordinator.ts 2f2630aa80fe\n---\n\n\n# 代码审查\n\n2026-10-19 首次审查发现的 1 项 P1 和 7 项 P2 已在当前工作区修复。以下记录修复方式与回归入口，不把“已修复”延伸成整个系统没有其他问题。\n\n## 修复与证据\n\n| 优先级 / 问题 | 当前处理 | 回归入口 |\n| --- | --- | --- |\n| P1：目录符号链接绕过辅助审批 | 拒绝路径任一层符号链接、悬空链接和父目录跳转；新文件也检查父目录。普通链接也转人工。 | `app/test/unit/health-regressions.test.mjs`：隐藏目录别名、最终文件与悬空链接，write/edit 双路径 |\n| P2：编辑待发绕过 32 MiB 上限 | 在暂存副本上验证最终 UTF-8 字节容量，成功后提交；拒绝保持原值、版本和授权。 | 同上：连续大附件编辑、超限 add/edit 与派发对象身份 |\n| P2：终端重连丢订阅 | 完整图握手后重发活跃 herdr 订阅，包含序号缺口触发的新 hello；不向 e 会话重放。 | `app/test/unit/live-store-reconnect.test.mjs` |\n| P2：同名节点事件串工作区 | 生产、广播、历史查询与速率统一携带工作区；兼容路由也限定活动工作区。 | `app/test/unit/e-routes.test.mjs`：两个工作区的同名节点 |\n| P2：pane 异常关闭不激活错误边 | 生命周期事件处理独立成方法，无退出标记时也激活错误处理分支。 | `app/test/unit/coordinator-failure.test.mjs`：exited/closed、重复事件和整图结束 |\n| P2：shell wrapper 拆开路径 | 统一 shell 参数引用，覆盖脚本、运行目录、节点参数和退出标记。 | `health-regressions.test.mjs`：空格、单引号、命令替换文本和非零退出码 |\n| P2：Markdown/CSV MIME 不兼容 | 明确文本 MIME 归一到纯文本；有二进制 MIME 时不按扩展名放行。 | `health-regressions.test.mjs`：空 MIME、Markdown、CSV 与二进制拒绝 |\n| P2：自动布局不重新适配视口 | React effect 显式订阅布局完成序号。 | `app/test/browser/e-canvas.spec.ts`：坐标移到远处后节点重新进入视口 |\n\n## 结构整理\n\n前端消息类型移到 `app/src/pages/canvas/contracts.ts`，真实 store 与 mock 依赖同一合同，消除原来的类型循环。旧 store 类型转导出仍可用。已删除没有入口引用的旧画布占位页。\n\n单元测试不再混在 API 目录。研究资料、阶段计划、运行指南和历史工具按职责归档，完整位置见[目录约定](repository-layout.md)。随后对 59 个未使用候选逐项复核：删除 34 个干净文件，保护 18 个未提交文件及其 7 个依赖。证据见[未使用文件复核](unused-files.md)，剩余候选仍如实列在[代码体检](health.md)。\n\n## 验证边界\n\n单元测试使用临时目录、假 WebSocket 和归一化生命周期事件；浏览器布局用例使用明确的协议 fixture。本轮没有启动真实 Pi 会话或 herdr 进程，没有重置用户工作区，也没有运行历史自动审批脚本。\n\n审批预检不能替代外部工具执行时的文件系统隔离；不宣称消除了任意并发文件替换风险。大文件热点和其他未使用导出继续保留在体检中，不为降低计数做无证据删除。\n","system.md":"---\ntitle: 系统总览\ndescription: 本地多 Agent 会话工作台\nsources:\n  - app/src/App.tsx 10682b846ed7 App\n  - app/api/index.ts fb665635c747 wireBroadcasts\n  - app/api/routes.ts 7cbd733eaf33 applySession wsHandlers\n  - app/api/e/session-manager.ts f1a051ecac53 SessionManager\n  - app/scripts/e-runtime-worker.mts 597fd806824d\n  - app/api/coordinator.ts 2f2630aa80fe\n---\n\n# 系统总览\n\n## 当前主线\n\n浏览器展示工作区和会话卡片，本地控制面管理工作区，每个真实会话由独立 worker 接入 e 核心与 Pi。消息和审批属于会话系统，画布保存的是位置、分区、身份和状态投影。\n\n`app/src/App.tsx` 的 `/` 是工作区列表，`/canvas/:workspaceId` 是产品画布。新建的文档站是独立工程 `docs-site/`，其 `/` 才是文档 Landing Page；它不替换产品首页，也不读取用户会话内容。\n\n## 进程边界\n\n| 边界 | 职责 | 代码依据 |\n| --- | --- | --- |\n| 浏览器 | 路由、画布、聊天呈现、本地界面状态 | `app/src/App.tsx`、[画布](modules/canvas.md)、[聊天](modules/chat-ui.md) |\n| 本地 Node 控制面 | HTTP / WS、工作区、生命周期与权限路由 | `app/api/index.ts`、`app/api/routes.ts` |\n| 会话 worker | 串行执行控制，桥接 e 核心和 Pi，汇报快照 | `app/scripts/e-runtime-worker.mts` |\n| 外部 ADE / Pi | 提供核心会话协议、原生会话与模型访问 | worker 从已配置的 ADE 安装动态加载；不在本仓库内实现 |\n| herdr 兼容服务 | pane、tab、终端和旧图调度 | `app/api/coordinator.ts`、[herdr 模块](modules/herdr.md) |\n\n控制面监听回环地址，并校验 Host 与 Origin。它是本地工具，不是带多用户身份系统的公网服务。不要为了远程访问直接取消这些检查。\n\n## 两种后端不能混用\n\ne 工作区允许创建真实 Pi 会话、发消息、管理待发、调整模型与思考级别、审批工具、停止与恢复。会话是否可控制，以核心快照中的能力及就绪状态为准。模型列表和原生身份来自运行时，不是 UI 编造。\n\nherdr 工作区保留强、弱、错误边调度与终端输入。控制路由会拒绝在 e 工作区执行旧图运行。e 现在通过 [Canvas 协作](modules/collaboration.md)提供同画布受管的读取、发布与消息发送，实际记录投影成独立通信边；连线仍不触发自动 DAG 调度、建会话或 Git 合并。\n\n`/react-flow`、`/tldraw` 和 `/welcome` 是原型入口。它们可以展示模拟事件，不代表真实后端具备这些编排行为。\n\n## 状态分别放在哪里\n\n工作区注册表保存图、坐标与归档状态；会话管理器另存会话记录、消息、队列及审批状态；协作账本单独保存文本产物、调用回执和通信记录。浏览器通过 HTTP 发命令，通过 WebSocket 接收图和会话变化。单条推送带工作区、连接代次与递增序号，客户端据此拒绝不属于当前状态的旧消息。\n\n会话的核心快照是运行状态依据，画布节点只是投影。服务启动会重新投影持久化会话，避免把旧图中的运行状态误认为还在执行。记录与原生会话路径的具体边界见[e 运行时](modules/e-runtime.md)。\n\n## 阅读依赖图时的限制\n\n静态图使用 oxc 解析当前工作区 JS/TS；自动读取 tsconfig 别名。类型导入保留，因此图上的依赖并不全部等同于运行时调用。模板字符串动态导入的 ADE 与 Pi 不会自动出现，需要结合 worker 的实际调用阅读。零入度文件已逐项列在[入口对账](entrypoints.md)。\n\n所有模块页都记录支撑论断的文件与哈希。哈希变化只能说明需要复核，不能证明业务含义一定变了；该判断仍需读代码。\n","unused-files.md":"---\ntitle: 未使用文件复核\ndescription: 59 个候选逐项裁决：删除 34 个干净文件，保护 18 个未提交文件及其 7 个依赖。\nsources:\n  - docs/architecture/unused-file-review.json 980db61b3b1c\n  - app/src/App.tsx 10682b846ed7\n  - app/components.json 411f77047b2c\n---\n\n# 未使用文件复核\n\n2026-10-19 对上一轮的 59 个 Knip 候选逐项核对。结果是 **34 个删除、18 个保护未提交内容、7 个保护依赖**，不是把 25 个保留文件认定为已经使用。\n\n## 判断依据\n\n- oxc 导入图中，没有从候选集合外部指向这 59 个文件的边。候选之间的内部引用不等于产品入口可达。\n- 再核对应用路由、测试、动态导入和组件生成配置。产品中的按钮、开关与通知仍在使用；shadcn 生成配置的路径别名不是自动加载所有组件的入口。\n- 文件名搜索会命中研究正文、CSS 和通用词，例如 `chart`、`input`、`select`。这些命中留在原始证据中，不能当成运行引用。\n- 删除前再次检查 Git 状态与文件 SHA-256。只删除仍然干净的文件；不重置、不暂存、不覆盖修改版，也不删除新增文件。\n- 从所有未提交候选出发计算传递依赖闭包，额外留下 7 个干净依赖。删除集合没有被任何剩余源码导入。\n- 原始路径、SHA-256、Git 状态、导入边和字符串引用保存于 `docs/architecture/unused-file-review.json`。体检会检查保留文件的内容、删除文件是否被恢复，以及候选是否已经接入；发生变化就标为需复核或不再未使用，不作为永久豁免。\n\n## 按职责保留\n\n| 职责 | 文件 | 为什么保留 |\n| --- | --- | --- |\n| 产品基础交互（不在 59 个候选内） | `button.tsx`、`button-variants.ts`、`switch.tsx`、`sonner.tsx` | 页面、边图例和通知有真实调用；保留在通用 UI 目录 |\n| 表单与日期（未接入） | `form.tsx`、`form-context.ts`、`calendar.tsx`；依赖 `label.tsx` | 保留已拆分的字段上下文与日期按钮改动 |\n| 导航与确认（未接入） | `navigation-menu.tsx`、`navigation-menu-variants.ts`、`pagination.tsx`、`alert-dialog.tsx` | 保留样式变体拆分及对应引用 |\n| 控件变体（未接入） | `badge*`、`button-group*`、`toggle*`；依赖 `separator.tsx` | 保留现有未提交的组件／样式拆分 |\n| 响应式侧栏（未接入） | `sidebar.tsx`、`sidebar-context.ts`；依赖 `input.tsx`、`separator.tsx`、`sheet.tsx`、`skeleton.tsx`、`tooltip.tsx`、`use-mobile.ts` | 保留上下文拆分和确定性 skeleton 改动；依赖不能单独删除 |\n| 审批兼容外观（未接入） | `app/src/pages/canvas/EApprovalCard.tsx` | 新增的兼容转发组件；当前真实聊天直接使用 ApprovalRequest，不制造调用来消除告警 |\n| 协作演示模型（未接入） | `app/src/pages/canvas/collaboration-demo/model.ts` | 新增的模拟剧本、状态转换与输出；不是实际多 Agent 编排 |\n\n除完整路径已标出的文件外，UI 文件位于 `app/src/components/ui/`，移动端 hook 位于 `app/src/hooks/`。本轮用职责索引区分已使用与未完成代码，**不为整理外观搬动未提交文件、重写其 import，或隐藏到排除目录**。\n\n## 59 项逐项结论\n\n| 文件 | 裁决 | 源码引用证据（清理前） |\n| --- | --- | --- |\n| `app/src/components/ui/accordion.tsx` | 删除（原文件无未提交改动） | 无仓内导入者；产品路由、动态加载与配置中未找到入口 |\n| `app/src/components/ui/alert-dialog.tsx` | 原样保留（未提交改动／新增） | 无仓内导入者；产品路由、动态加载与配置中未找到入口 |\n| `app/src/components/ui/alert.tsx` | 删除（原文件无未提交改动） | 无仓内导入者；产品路由、动态加载与配置中未找到入口 |\n| `app/src/components/ui/aspect-ratio.tsx` | 删除（原文件无未提交改动） | 无仓内导入者；产品路由、动态加载与配置中未找到入口 |\n| `app/src/components/ui/avatar.tsx` | 删除（原文件无未提交改动） | 无仓内导入者；产品路由、动态加载与配置中未找到入口 |\n| `app/src/components/ui/b   focusSet(new Set(steps.flatMap(s => [s.from, s.to])));
  for (const s of steps) hopNode(s.to);
  gStreak.style.display = "none";
  clearPulses();
  for (const j of beats[k]) if (flowEls[j]) addPulse(flowEls[j].p, k);
}
const showStep = i => showBeat(curBeats().findIndex(b => b.includes(i)));
function pauseAuto() { if (auto) clearTimeout(auto); auto = null; }
function stopFlowVisual() {
  pauseAuto(); beatIdx = -1; clearPulses();
  gStreak.style.display = "";
  flowEls.forEach(({ p, glow }) => { p.setAttribute("stroke", "var(--ink)");
    p.setAttribute("stroke-width", 1.6); p.setAttribute("marker-end", "url(#arr)");
    p.setAttribute("opacity", 1); glow.setAttribute("opacity", 0); });
}
document.getElementById("btnPlay").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); }
  stopFlowVisual(); buildEdges(stepsOf(activeFlow)); showBeat(0);
  const total = curBeats().length;
  const tick = () => {
    if (beatIdx + 1 >= total) { auto = null; return; }
    showBeat(beatIdx + 1);
    auto = setTimeout(tick, motionOK ? 620 : 400);
  };
  auto = setTimeout(tick, motionOK ? 620 : 400);
};
document.getElementById("btnStep").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); buildEdges(stepsOf(0)); }
  pauseAuto(); showBeat((beatIdx + 1) % (curBeats().length || 1));
};

/* ── 取景 / 平移缩放 / 响应式 ── */
const stage = document.getElementById("stage");
function fitHome() {
  const boxes = [gDist.getBBox(), gNode.getBBox(), gPlate.getBBox(), gTag.getBBox()];
  const x = Math.min(...boxes.map(b => b.x)) - 18, y = Math.min(...boxes.map(b => b.y)) - 16;
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.width)) + 18 - x,
    h: Math.max(...boxes.map(b => b.y + b.height)) + 16 - y };
}
const HOME = fitHome();
let vb = { ...HOME }, homeView = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById("btnReset").onclick = () => { stopFlowVisual(); select(null); vbT = null; vb = { ...HOME }; homeView = true; applyVB(); };
new ResizeObserver(() => { if (homeView) applyVB(); }).observe(stage);
let pan = null, moved = false, pinch = null;
const touches = new Map();
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".b") || e.target.closest(".lk") || e.target.closest("#flowbar")) return;
  if (vbT) { vb = { ...vbT }; vbT = null; applyVB(); }   // 手势接管前先把追赶中的缩放落定
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  if (touches.size === 2) {   // 双指捿合：以按下时取景为基准缩放
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, vb: { ...vb } };
    pan = null; moved = true;
    stage.classList.remove("panning");
    return;
  }
  // 记住起手落在哪块地板：指针捕获后 pointerup/click 的 target 都会被重定向到画布，当场判不出来
  pan = { px: e.clientX, py: e.clientY, x: vb.x, y: vb.y, floor: e.target.closest(".dfloor")?.dataset.d || null };
  moved = false;
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const k = pinch.d / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1);
    const r = svg.getBoundingClientRect();
    const mx = pinch.vb.x + ((a[0] + b[0]) / 2 - r.left) / r.width * pinch.vb.w;
    const my = pinch.vb.y + ((a[1] + b[1]) / 2 - r.top) / r.height * pinch.vb.h;
    vb = { x: mx - (mx - pinch.vb.x) * k, y: my - (my - pinch.vb.y) * k, w: pinch.vb.w * k, h: pinch.vb.h * k };
    homeView = false; applyVB();
    return;
  }
  if (!pan) return;
  if (Math.hypot(e.clientX - pan.px, e.clientY - pan.py) > 3) moved = true;
  const k = vb.w / stage.clientWidth;
  vb.x = pan.x - (e.clientX - pan.px) * k; vb.y = pan.y - (e.clientY - pan.py) * k;
  if (moved) { homeView = false; applyVB(); }
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
};
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerup", e => {
  endPointer(e);
  const wasPan = pan; pan = null; stage.classList.remove("panning");
  if (e.pointerType !== "mouse") hideEdgeTag();   // 触屏无 mouseleave，气泡会滞留
  // 未拖动的单击：落在地板上选中分区，落在真空白处取消选中
  if (wasPan && !moved) select(wasPan.floor ? { district: wasPan.floor } : null);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const b = vbT || vb;   // 连续滚轮在目标上复利，锚点映射才不漂
  const r = svg.getBoundingClientRect();
  const mx = b.x + (e.clientX - r.left) / r.width * b.w;
  const my = b.y + (e.clientY - r.top) / r.height * b.h;
  const t = { x: mx - (mx - b.x) * k, y: my - (my - b.y) * k, w: b.w * k, h: b.h * k };
  homeView = false;
  if (motionOK) vbT = t; else { vb = t; applyVB(); }
}, { passive: false });

applyVB();
render();
</script>
</body>
